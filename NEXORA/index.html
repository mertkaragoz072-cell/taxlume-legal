<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5ec4ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/app_icon/app_icon_1024_opaque.png">
<title>NEXORA</title>
<link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div id="avatar-ring"><canvas id="avatar" width="112" height="112"></canvas></div>
      <div id="hud-bars">
        <div class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text">120 / 120</span></div>
        <div class="lvbar" id="level-pulse"><div id="xp-fill" class="xpfill"></div><span>Lv. <b id="hud-level">1</b></span></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="pill" id="pill-coin"><i class="coin-icon"></i><span id="hud-coins">0</span></div>
      <div class="pill" id="pill-gem"><i class="gem-icon"></i><span id="hud-gems">0</span></div>
    </div>
    <div class="hud-side">
      <button type="button" class="sidebtn" disabled title="Ayarlar (yakında)">&#9881;</button>
      <button type="button" class="sidebtn" disabled title="Envanter (yakında)">&#127890;</button>
      <button type="button" class="sidebtn" disabled title="Görevler (yakında)">&#128220;</button>
    </div>
  </div>

  <div id="joystick" aria-hidden="true"><i class="chev l"></i><i class="chev r"></i><div id="stick"></div></div>

  <div id="actions">
    <button type="button" id="btn-skill2" class="skillbtn s2" aria-label="Yıldız Patlaması (E)"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.7z"/></svg></button>
    <button type="button" id="btn-skill1" class="skillbtn s1" aria-label="Mavi Dalga (Q)"><svg viewBox="0 0 24 24"><path d="M13 2L5 13h6l-1 9 9-12h-6z"/></svg></button>
    <button type="button" id="btn-attack" aria-label="Saldırı"><svg viewBox="0 0 24 24"><g stroke-linejoin="round"><path d="M21 3v6L11 19 5 13 15 3z"/><path d="M3 11l4 4-2 2-4-4z"/><path d="M5 17l2 2-4 4-2-2z"/></g></svg></button>
  </div>

  <div id="gameover" class="hidden">
    <div class="panel">
      <h1>Game Over</h1>
      <p>Seviye <b id="go-level">1</b> &middot; Öldürülen <b id="go-kills">0</b> &middot; Coin <b id="go-coins">0</b></p>
      <button id="restart-btn" type="button">Yeniden Başla</button>
    </div>
  </div>

  <div id="select" class="hidden">
    <div class="sel-box">
      <img class="sel-logo" src="assets/logo/nexora_logo.png" alt="NEXORA">
      <h2>Karakterini Seç</h2>
      <div class="sel-cards" id="sel-cards"></div>
    </div>
  </div>

  <div id="rotate-hint"><div><div class="phone">&#128241;</div><p>Lütfen telefonu <b>yatay</b> çevirin</p></div></div>

  <div id="loaderror" class="hidden"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
