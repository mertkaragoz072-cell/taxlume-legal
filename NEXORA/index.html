<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5ec4ff">
<title>NEXORA</title>
<link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-left">
      <div id="avatar-ring"><canvas id="avatar" width="112" height="112"></canvas></div>
      <div id="hud-bars">
        <div class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text">120 / 120</span></div>
        <div class="lvbar"><div id="xp-fill" class="xpfill"></div><span>Lv. <b id="hud-level">1</b></span></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="pill"><i class="coin-icon"></i><span id="hud-coins">0</span></div>
      <div class="pill"><i class="gem-icon"></i><span id="hud-gems">0</span></div>
    </div>
    <div class="hud-side">
      <button type="button" class="sidebtn" disabled title="Ayarlar (yakında)">&#9881;</button>
      <button type="button" class="sidebtn" disabled title="Envanter (yakında)">&#127890;</button>
      <button type="button" class="sidebtn" disabled title="Görevler (yakında)">&#128220;</button>
    </div>
  </div>

  <div id="joystick" aria-hidden="true"><div id="stick"></div></div>

  <div id="gameover" class="hidden">
    <div class="panel">
      <h1>Game Over</h1>
      <p>Seviye <b id="go-level">1</b> &middot; Öldürülen <b id="go-kills">0</b> &middot; Coin <b id="go-coins">0</b></p>
      <button id="restart-btn" type="button">Yeniden Başla</button>
    </div>
  </div>

  <div id="loaderror" class="hidden"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
