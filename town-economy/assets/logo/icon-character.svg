<!-- Golden Town — casual-game app icon.
     Hand-authored, NOT generated by scripts/build-logo.js. Edit this file
     directly; re-running that script will not touch it.

     A second, deliberately different direction from the relief logo: the
     character-forward icon that casual and idle games use on the stores —
     one big smiling face, a bright saturated scene, a silhouette that still
     reads at 38px. The relief mark is the brand; this is the shop window. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4aa8e0"/>
    <stop offset="0.55" stop-color="#9ed6f2"/>
    <stop offset="1" stop-color="#ffe6ae"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.42" r="0.5">
    <stop offset="0" stop-color="#fff3c0" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#fff3c0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8dc85a"/><stop offset="1" stop-color="#5fa33c"/>
  </linearGradient>
  <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b7dc90"/><stop offset="1" stop-color="#8ec468"/>
  </linearGradient>
  <linearGradient id="tunic" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#f08a3c"/><stop offset="1" stop-color="#c25e1e"/>
  </linearGradient>
  <linearGradient id="skin" x1="0.25" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#e7ab72"/>
  </linearGradient>
  <linearGradient id="cap" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#a5693a"/><stop offset="1" stop-color="#75451f"/>
  </linearGradient>
  <radialGradient id="coin" cx="0.36" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#fff6cf"/>
    <stop offset="0.45" stop-color="#ffd764"/>
    <stop offset="1" stop-color="#d79422"/>
  </radialGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#e2704a"/><stop offset="1" stop-color="#b44f30"/>
  </linearGradient>
</defs>

<!-- sky + sun -->
<rect width="512" height="512" fill="url(#sky)"/>
<circle cx="256" cy="215" r="250" fill="url(#sun)"/>

<!-- clouds -->
<g fill="#ffffff" opacity="0.85">
  <ellipse cx="86" cy="96" rx="44" ry="21"/><ellipse cx="120" cy="88" rx="30" ry="24"/>
  <ellipse cx="428" cy="70" rx="38" ry="18"/><ellipse cx="400" cy="64" rx="24" ry="19"/>
</g>

<!-- far hills -->
<path d="M-20 300 Q90 250 210 292 Q330 334 532 278 L532 420 L-20 420 Z" fill="url(#hillBack)"/>

<!-- town, kept to the sides so the character never buries it -->
<g>
  <rect x="24" y="238" width="62" height="74" rx="5" fill="#f7eed8"/>
  <path d="M14 240 L55 200 L96 240 Z" fill="url(#roof)"/>
  <rect x="40" y="272" width="20" height="40" rx="3" fill="#c9a97e" opacity="0.5"/>
  <rect x="92" y="262" width="46" height="50" rx="4" fill="#f0e3c8"/>
  <path d="M84 264 L115 234 L146 264 Z" fill="url(#roof)"/>

  <rect x="398" y="244" width="40" height="68" rx="4" fill="#f3e6cc"/>
  <path d="M390 246 L418 214 L446 246 Z" fill="url(#roof)"/>
  <rect x="444" y="266" width="56" height="46" rx="4" fill="#f7eed8"/>
  <path d="M436 268 L472 238 L508 268 Z" fill="url(#roof)"/>

  <g fill="#4f9b3c"><circle cx="160" cy="288" r="24"/><circle cx="374" cy="290" r="22"/></g>
</g>

<!-- front hill -->
<path d="M-20 330 Q140 296 268 326 Q396 356 532 318 L532 532 L-20 532 Z" fill="url(#hill)"/>

<!-- ---------- character ---------- -->
<g>
  <!-- raised arm: shoulder to elbow to hand, drawn as one tapering limb -->
  <path d="M330 452 C388 442 418 392 410 316" stroke="#c25e1e" stroke-width="62" stroke-linecap="round" fill="none"/>
  <path d="M330 452 C388 442 418 392 410 316" stroke="url(#tunic)" stroke-width="50" stroke-linecap="round" fill="none"/>

  <!-- coin, clear of the head and the biggest bright shape in the icon -->
  <g transform="translate(410 214)">
    <circle r="72" fill="#a86a18"/>
    <circle r="64" fill="url(#coin)"/>
    <circle r="48" fill="none" stroke="#e0a637" stroke-width="6" opacity="0.55"/>
    <path d="M-26 -36 Q2 -52 30 -32" stroke="#fffbe8" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
  <!-- hand gripping the coin from below -->
  <g fill="url(#skin)">
    <ellipse cx="410" cy="286" rx="36" ry="27"/>
    <circle cx="384" cy="262" r="11"/><circle cx="404" cy="256" r="11"/><circle cx="424" cy="258" r="11"/>
  </g>

  <!-- torso -->
  <path d="M248 372 C312 372 358 410 370 472 L378 532 L118 532 L126 472 C138 410 184 372 248 372 Z" fill="url(#tunic)"/>
  <path d="M206 384 L286 532 L250 532 L182 396 Z" fill="#8a5a2e"/>
  <!-- shadow the head casts on the chest -->
  <ellipse cx="248" cy="392" rx="76" ry="26" fill="#9c4a14" opacity="0.35"/>
  <path d="M212 374 Q248 404 284 374 Q266 366 248 366 Q230 366 212 374 Z" fill="#ffe0b0" opacity="0.9"/>
  <rect x="224" y="336" width="48" height="46" rx="20" fill="#d99a63"/>

  <!-- head -->
  <ellipse cx="248" cy="256" rx="92" ry="94" fill="url(#skin)"/>
  <circle cx="156" cy="262" r="17" fill="#e7ab72"/>
  <circle cx="340" cy="262" r="17" fill="#e7ab72"/>

  <!-- beard framing the jaw -->
  <path d="M166 268 Q172 356 248 362 Q324 356 330 268 Q314 330 248 332 Q182 330 166 268 Z" fill="#7a4a25"/>

  <!-- hair at the temples, so the cap reads as a cap and not a haircut -->
  <path d="M160 236 Q166 200 196 190 L196 236 Z" fill="#6b3f1e"/>
  <path d="M336 236 Q330 200 300 190 L300 236 Z" fill="#6b3f1e"/>

  <!-- cap: a clear dome plus a short brim with shadow beneath it -->
  <path d="M160 196 Q168 124 248 124 Q328 124 336 196 Z" fill="url(#cap)"/>
  <ellipse cx="248" cy="132" rx="26" ry="12" fill="#b97c46" opacity="0.6"/>
  <path d="M146 196 Q248 178 350 196 Q352 214 334 214 Q248 198 162 214 Q144 214 146 196 Z" fill="#6b3f1e"/>
  <path d="M162 214 Q248 198 334 214 Q248 230 162 214 Z" fill="#c08a52" opacity="0.35"/>

  <!-- eyes -->
  <ellipse cx="210" cy="250" rx="24" ry="26" fill="#ffffff"/>
  <ellipse cx="288" cy="250" rx="24" ry="26" fill="#ffffff"/>
  <circle cx="215" cy="254" r="12" fill="#3a2418"/>
  <circle cx="293" cy="254" r="12" fill="#3a2418"/>
  <circle cx="210" cy="248" r="5" fill="#ffffff"/>
  <circle cx="288" cy="248" r="5" fill="#ffffff"/>
  <path d="M188 220 Q210 210 234 218" stroke="#5e3a1d" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M264 218 Q288 210 310 220" stroke="#5e3a1d" stroke-width="10" stroke-linecap="round" fill="none"/>

  <ellipse cx="178" cy="288" rx="21" ry="13" fill="#f2896a" opacity="0.5"/>
  <ellipse cx="320" cy="288" rx="21" ry="13" fill="#f2896a" opacity="0.5"/>

  <path d="M202 292 Q248 344 296 292 Q248 310 202 292 Z" fill="#5c2b1c"/>
  <path d="M208 296 Q248 310 290 296 Q248 306 208 296 Z" fill="#ffffff"/>
  <path d="M240 268 Q248 284 258 272" stroke="#d29463" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- warm rim light down the lit side -->
  <path d="M338 210 Q356 254 334 306" stroke="#fff3d2" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.55"/>
</g>
</svg>
