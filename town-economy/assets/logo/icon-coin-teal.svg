<!-- Golden Town — modern store icon.
     Hand-authored, NOT generated by scripts/build-logo.js. Edit this file
     directly; re-running that script leaves it alone.

     Every gradient id carries a per-file suffix. These icons get inlined
     next to each other in previews and docs, and duplicate ids make a
     browser resolve every reference to the first definition it parsed —
     which silently rendered four different backgrounds identically. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="bgi13" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#0e6b70"/><stop offset="1" stop-color="#06303f"/>
  </linearGradient>
  <radialGradient id="glowi13" cx="0.5" cy="0.44" r="0.62">
    <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.4"/>
    <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="facei13" x1="0.12" y1="0" x2="0.78" y2="1">
    <stop offset="0" stop-color="#fff8dc"/>
    <stop offset="0.32" stop-color="#ffd96b"/>
    <stop offset="0.68" stop-color="#eeaa31"/>
    <stop offset="1" stop-color="#c07818"/>
  </linearGradient>
  <linearGradient id="sidei13" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9771c"/><stop offset="1" stop-color="#844f10"/>
  </linearGradient>
  <linearGradient id="smalli13" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#d9962a"/>
  </linearGradient>
  <radialGradient id="sheeni13" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="coinClipi13">
    <ellipse cx="256" cy="248" rx="156" ry="126"/>
  </clipPath>
</defs>

<rect width="512" height="512" fill="url(#bgi13)"/>
<rect width="512" height="512" fill="url(#glowi13)"/>
<ellipse cx="256" cy="428" rx="172" ry="32" fill="#000000" opacity="0.32"/>

<!-- two coins behind, each a proper disc: dark under-ellipse, edge, lit top -->
<g>
  <ellipse cx="104" cy="392" rx="70" ry="54" fill="#844f10"/>
  <rect x="34" y="370" width="140" height="22" fill="#844f10"/>
  <ellipse cx="104" cy="370" rx="70" ry="54" fill="url(#smalli13)"/>
  <ellipse cx="104" cy="370" rx="52" ry="38" fill="none" stroke="#c07818" stroke-width="5" opacity="0.45"/>

  <ellipse cx="410" cy="398" rx="62" ry="48" fill="#844f10"/>
  <rect x="348" y="378" width="124" height="20" fill="#844f10"/>
  <ellipse cx="410" cy="378" rx="62" ry="48" fill="url(#smalli13)"/>
  <ellipse cx="410" cy="378" rx="46" ry="34" fill="none" stroke="#c07818" stroke-width="5" opacity="0.45"/>
</g>

<!-- hero coin -->
<ellipse cx="256" cy="280" rx="156" ry="126" fill="url(#sidei13)"/>
<rect x="100" y="248" width="312" height="32" fill="url(#sidei13)"/>
<ellipse cx="256" cy="248" rx="156" ry="126" fill="url(#facei13)"/>
<ellipse cx="256" cy="248" rx="134" ry="108" fill="none" stroke="#c07818" stroke-width="8" opacity="0.45"/>

<!-- town struck into the face -->
<g transform="translate(256 248) scale(1.72) translate(-50 -50)">
  <g transform="translate(0 2.6)"><path d="M19 56 h18 v18 h-18 Z" fill="#a86a18"/><path d="M15.8 56 L28 45 L40.2 56 Z" fill="#a86a18"/><path d="M42.5 47 h18 v27 h-18 Z" fill="#a86a18"/><path d="M39.3 47 L51.5 36 L63.7 47 Z" fill="#a86a18"/><path d="M66 36 h18 v38 h-18 Z" fill="#a86a18"/><path d="M62.8 36 L75 25 L87.2 36 Z" fill="#a86a18"/><path d="M16.5 75.4 h67 v4.6 h-67 Z" fill="#a86a18"/></g>
  <path d="M19 56 h18 v18 h-18 Z" fill="#fff6dc"/><path d="M15.8 56 L28 45 L40.2 56 Z" fill="#fff6dc"/><path d="M42.5 47 h18 v27 h-18 Z" fill="#fff6dc"/><path d="M39.3 47 L51.5 36 L63.7 47 Z" fill="#fff6dc"/><path d="M66 36 h18 v38 h-18 Z" fill="#fff6dc"/><path d="M62.8 36 L75 25 L87.2 36 Z" fill="#fff6dc"/><path d="M16.5 75.4 h67 v4.6 h-67 Z" fill="#fff6dc"/>
</g>

<!-- sheen: a soft blob clipped to the coin, not a hard shape sitting on top -->
<g clip-path="url(#coinClipi13)">
  <ellipse cx="198" cy="182" rx="118" ry="62" fill="url(#sheeni13)" transform="rotate(-18 198 182)"/>
</g>

<g fill="#fff6d0">
  <path d="M430 138 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10 Z" opacity="0.95"/>
  <path d="M84 188 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z" opacity="0.8"/>
</g>
</svg>
