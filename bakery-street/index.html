<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#463020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Fırın &amp; Kafe</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/app/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/app/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Fırın &amp; Kafe sokağı"></canvas>
    <div id="hud"></div>
    <button class="back-btn" id="back" aria-label="Sokağa dön"><img class="pic" alt="" draggable="false" src="assets/icons/hud-back.webp">Sokak</button>
    <aside id="panel" hidden></aside>
    <aside id="marketPanel" hidden></aside>
    <aside id="explorePanel" hidden></aside>
    <aside id="researchPanel" hidden></aside>
    <aside id="townPanel" hidden></aside>
    <aside id="questPanel" hidden></aside>
    <aside id="dailyPanel" hidden></aside>
    <aside id="settingsPanel" hidden></aside>
    <div id="orderBar" aria-label="Siparişler"></div>
    <nav id="nav" aria-label="Ana menü"></nav>
    <div id="saveWarn" role="alert" hidden></div>
    <div id="loading" role="status"><div class="ld-card"><img class="ld-logo" src="assets/app/logo.webp" alt="" draggable="false"><b>Fırın &amp; Kafe</b><div class="ld-bar"><i id="ldFill"></i></div><span id="ldText">Yükleniyor…</span><button id="ldRetry" hidden>Yeniden yükle</button></div></div>
    <div id="tabLock" role="alertdialog" hidden><div class="ld-card"><b>Oyun başka bir sekmede açık</b><span>İlerlemenin karışmaması için bu sekme durduruldu. Burada devam edersen diğer sekme durur.</span><button id="tabTake">Bu sekmede devam et</button></div></div>
    <div id="fade"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <div id="rotate" role="alert">
    <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><rect x="20" y="6" width="24" height="42" rx="5" fill="none" stroke="#fff" stroke-width="4"/><path d="M8 52h48M48 44l8 8-8 8" fill="none" stroke="#c99a61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p>Lütfen telefonunuzu yatay çevirin</p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
