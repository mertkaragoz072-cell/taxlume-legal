name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: town-economy

jobs:
  verify:
    name: Typecheck, lint, format, i18n, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: town-economy/package-lock.json

      # `ci` over `install`: it installs exactly the locked tree and fails
      # loudly if package.json and the lockfile have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Turkish is the default language and English the toggle; a key present
      # in one and missing from the other ships a raw key path to players.
      - name: Check translation parity
        run: npm run check:i18n

      - name: Unit tests
        run: npm run test:ci
