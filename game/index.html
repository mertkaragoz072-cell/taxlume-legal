<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pati Nöbeti</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap">
<style>
  :root{
    --ink:#223142;
    --sky-top:#7cc8e8;
    --sky-bot:#bfe9d6;
    --grass:#8fc93b;
    --grass-deep:#79ad2c;
    --danger:#e2604f;
    --danger-deep:#c14a3c;
    --dirt:#8c5a34;
    --dirt-deep:#6e4527;
    --panel-sky:#e3f4f8;
    --panel-sky-deep:#cfe9f0;
    --panel-belt:#9c6a3c;
    --panel-belt-deep:#7c5230;
    --paper:#fffdf7;
    --accent:#ffb92e;
    --accent-deep:#e69a12;
    --good:#5ec95e;
    --font-display:'Baloo 2', ui-rounded, system-ui, sans-serif;
    --font-body:'Quicksand', system-ui, sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; padding:0; height:100%; }
  body{
    min-height:100%; display:flex; align-items:center; justify-content:center;
    background:#1b232c; font-family:var(--font-body); padding:18px;
  }
  #stage{
    position:relative; width:100%; max-width:400px; aspect-ratio:9/18.5; max-height:900px;
    background:var(--paper); border-radius:22px; overflow:hidden; touch-action:none;
    box-shadow:0 18px 44px rgba(0,0,0,.5), 0 0 0 6px #0f151b;
    display:flex; flex-direction:column;
  }

  /* ---------- Battlefield ---------- */
  #battlefield{
    position:relative; flex:0 0 48%; overflow:hidden;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bot) 62%, var(--sky-bot) 62%);
  }
  #trees{ position:absolute; right:5%; top:6%; font-size:34px; line-height:1; filter:drop-shadow(0 3px 0 rgba(0,0,0,.08)); }
  #waveBanner{
    position:absolute; top:8px; left:0; right:0; text-align:center; z-index:20;
    font-family:var(--font-display); font-weight:800; font-size:27px; color:#fff;
    -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-wrap:balance;
  }
  #waveSub{
    position:absolute; top:41px; left:0; right:0; text-align:center; z-index:20; opacity:0; transition:opacity .3s;
    font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--accent);
    -webkit-text-stroke:2px var(--ink); paint-order:stroke fill;
  }
  #ground{ position:absolute; left:0; right:0; bottom:0; top:54%; display:flex; }
  .side{ position:relative; flex:1; height:100%; }
  .side.green{ background:linear-gradient(to bottom, var(--grass), var(--grass-deep)); }
  .side.red{ background:linear-gradient(to bottom, var(--danger), var(--danger-deep)); }
  #ground::after{
    content:''; position:absolute; left:0; right:0; bottom:-9%; height:24%;
    background:linear-gradient(to bottom, var(--dirt), var(--dirt-deep)); z-index:-1;
  }
  .hpbar{
    position:absolute; top:7px; left:50%; transform:translateX(-50%);
    width:76%; max-width:150px; height:17px; background:var(--ink); border-radius:5px;
    border:2px solid var(--ink); overflow:hidden; z-index:5;
  }
  .hpbar .fill{ height:100%; background:var(--good); transition:width .25s; }
  .hpbar.enemy .fill{ background:#ff6a58; }
  .hpbar .hptext{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:var(--font-body); font-weight:700; font-size:10px; font-variant-numeric:tabular-nums;
  }
  #player{ position:absolute; bottom:4%; left:14%; width:104px; height:104px; z-index:4; filter:drop-shadow(0 3px 0 rgba(0,0,0,.1)); }
  #player svg{ width:100%; height:100%; overflow:visible; }
  #playerGunHold{
    position:absolute; left:66%; top:46%; width:52%; z-index:6; pointer-events:none;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.15));
  }
  #enemies{
    position:absolute; bottom:5%; left:0; right:0; display:flex; justify-content:center; align-items:flex-end;
    flex-wrap:wrap-reverse; gap:2px 6px; padding:0 6px; z-index:3;
  }
  .enemy{ position:relative; text-align:center; transition:opacity .25s, transform .15s; filter:drop-shadow(0 3px 0 rgba(0,0,0,.1)); }
  .enemy .art svg{ width:100%; height:100%; overflow:visible; }
  .enemy .ehp{
    position:absolute; top:-15px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; border-radius:4px; font-size:9px; font-weight:700;
    padding:1px 4px; white-space:nowrap; font-variant-numeric:tabular-nums; z-index:2;
  }
  .enemy.hit{ transform:scale(1.15); filter:brightness(1.5); }
  .enemy.dead{ opacity:0; transform:scale(.4) translateY(10px); }
  .float{
    position:absolute; font-family:var(--font-display); font-weight:800; font-size:14px; color:#fff;
    -webkit-text-stroke:2px var(--ink); paint-order:stroke fill;
    pointer-events:none; animation:floatUp .8s ease-out forwards; z-index:30;
  }
  .float.crit{ color:var(--accent); font-size:18px; }
  .float.miss{ color:#e9e9e9; font-style:italic; }
  @keyframes floatUp{ 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-36px);} }
  .muzzle{
    position:absolute; bottom:38%; left:26%; width:13px; height:13px; border-radius:50%;
    background:radial-gradient(circle, #fff6c8, var(--accent) 60%, transparent 72%);
    animation:flash .12s ease-out forwards; z-index:6; pointer-events:none;
  }
  @keyframes flash{ from{opacity:1; transform:scale(1);} to{opacity:0; transform:scale(1.8);} }

  #startScreen, #gameOverScreen{
    position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(20,26,32,.62); color:#fff; text-align:center; padding:22px;
  }
  #startScreen[hidden], #gameOverScreen[hidden]{ display:none; }
  .title{ font-family:var(--font-display); font-weight:800; font-size:28px; margin:0 0 6px; text-wrap:balance; }
  .subtitle{ font-family:var(--font-body); font-weight:600; font-size:13px; opacity:.9; margin:0 0 20px; max-width:280px; line-height:1.5; }
  .bigBtn{
    font-family:var(--font-display); background:var(--good); color:#fff; border:none; border-radius:14px;
    padding:13px 38px; font-size:19px; font-weight:800; box-shadow:0 4px 0 #2f8f2f; cursor:pointer;
  }
  .bigBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #2f8f2f; }

  /* ---------- HUD ---------- */
  #hud{ flex:1; background:var(--panel-belt); display:flex; flex-direction:column; padding:8px 9px 10px; min-height:0; }
  #statsRow{
    display:flex; justify-content:space-between; background:var(--panel-sky); border-radius:12px 12px 0 0;
    padding:7px 4px 5px; font-family:var(--font-body);
  }
  #statsRow .stat{ flex:1; text-align:center; }
  #statsRow .stat .ic{ font-size:14px; display:block; }
  #statsRow .stat span:last-child{ font-weight:700; font-size:10px; color:var(--ink); font-variant-numeric:tabular-nums; }
  #boardWrap{ background:var(--panel-sky-deep); border-radius:0 0 12px 12px; padding:6px; flex:1; display:flex; flex-direction:column; min-height:0; }
  .sectionLabel{
    font-family:var(--font-body); font-weight:700; font-size:9px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink); opacity:.55; margin:2px 0 3px 2px;
  }
  #grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; flex:1; min-height:0; }
  .slot{
    position:relative; background:var(--paper); border-radius:7px; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(34,49,66,.08);
  }
  .slot.equip{ background:#fff3d9; outline:2px dashed var(--accent-deep); }
  .slot .gunbox{ width:88%; height:88%; pointer-events:none; }
  .slot .frag{ width:70%; height:70%; pointer-events:none; }
  .slot .count{
    position:absolute; bottom:1px; right:3px; font-size:11px; font-weight:800; color:var(--ink);
    background:rgba(255,255,255,.85); border-radius:4px; padding:0 3px;
  }
  .slot.dragging-src{ opacity:.25; }
  .slot.drop-target{ outline:2px solid var(--good); }
  .slot.drop-reject{ outline:2px solid var(--danger-deep); }
  #tray{ display:flex; gap:4px; margin-top:2px; padding:4px; background:var(--panel-belt-deep); border-radius:10px; min-height:38px; }
  #tray .slot{ background:#f4f1ea; flex:1; max-width:15%; }
  .dragClone{ position:fixed; width:44px; height:44px; pointer-events:none; z-index:999; opacity:.92; transform:translate(-50%,-50%); }
  .footerLinks{ text-align:center; padding:6px 0 0; font-family:var(--font-body); font-size:10px; }
  .footerLinks a{ color:rgba(255,255,255,.6); margin:0 6px; text-decoration:none; }
</style>
</head>
<body>

<div id="stage">

  <div id="battlefield">
    <div id="trees">🌲🌳🌲</div>
    <div id="waveBanner">Wave <span id="waveNum">1</span></div>
    <div id="waveSub"></div>

    <div id="ground">
      <div class="side green" id="playerSide">
        <div class="hpbar" id="playerHpBar"><div class="fill" id="playerHpFill"></div><span class="hptext" id="playerHpText"></span></div>
        <div id="player"></div>
        <div id="playerGunHold"></div>
      </div>
      <div class="side red" id="enemySide">
        <div class="hpbar enemy" id="enemyHpBar"><div class="fill" id="enemyHpFill"></div><span class="hptext" id="enemyHpText"></span></div>
        <div id="enemies"></div>
      </div>
    </div>

    <div id="startScreen">
      <div class="title">🐾 Pati Nöbeti</div>
      <p class="subtitle">Çiftlik dalga dalga saldırıyor. Silahını nöbetin sonuna kadar ayakta kalacak şekilde birleştir (merge) ve güçlendir.</p>
      <button class="bigBtn" id="startBtn">OYNA</button>
    </div>

    <div id="gameOverScreen" hidden>
      <div class="title">💀 Nöbet Bitti</div>
      <p class="subtitle" id="goStats"></p>
      <button class="bigBtn" id="restartBtn">TEKRAR OYNA</button>
    </div>
  </div>

  <div id="hud">
    <div id="statsRow">
      <div class="stat"><span class="ic">⚔️</span><span id="statDmg">0</span></div>
      <div class="stat"><span class="ic">🎯</span><span id="statAcc">0%</span></div>
      <div class="stat"><span class="ic">💥</span><span id="statCrit">0%</span></div>
      <div class="stat"><span class="ic">🔥</span><span id="statRate">0%</span></div>
      <div class="stat"><span class="ic">🪶</span><span id="statPierce">0%</span></div>
    </div>
    <div id="boardWrap">
      <div class="sectionLabel">Cephanelik — aynı parçaları birleştir, silahına sürükle</div>
      <div id="grid"></div>
      <div id="tray"></div>
    </div>
  </div>

</div>

<div class="footerLinks"><a href="../privacy.html">Privacy</a> · <a href="../terms.html">Terms</a></div>

<script>

  var TIERS = [

  function oxSVG(){
    return '<svg viewBox="0 0 130 110" xmlns="http://www.w3.org/2000/svg">' +

      '<ellipse cx="92" cy="64" rx="12" ry="10" fill="#e7e2d6"/>' +
      '<circle cx="26" cy="52" r="20" fill="#fff" stroke="'+INK+'" stroke-width="5"/>' +
      '<path d="M12,38 Q0,30 4,18" fill="none" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round"/>' +
      '<path d="M34,36 Q46,26 42,14" fill="none" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round"/>' +
      '<ellipse cx="12" cy="58" rx="10" ry="8" fill="#f6f0e6" stroke="'+INK+'" stroke-width="4"/>' +
      '<circle cx="8" cy="58" r="1.6" fill="'+INK+'"/><circle cx="16" cy="58" r="1.6" fill="'+INK+'"/>' +
      '<line x1="18" y1="42" x2="30" y2="45" stroke="'+INK+'" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="24" cy="50" r="2.8" fill="'+INK+'"/>' +
      '</svg>';
  }

  var ENEMY_TYPES = [
    { draw:chickenSVG, hp:40,  dmg:3 },
    { draw:goatSVG,    hp:70,  dmg:5 },
    { draw:dinoSVG,    hp:130, dmg:8 },
    { draw:oxSVG,      hp:220, dmg:12 }
  ];

  var state = null;

  function freshState(){
    return {
      wave: 1,
      playerHpMax: 300,
      playerHp: 300,
      equipTier: 1,
      board: new Array(18).fill(null),
      tray: new Array(5).fill(null),
      enemies: [],
      lastPlayerShot: 0,
      running: false,
      waveClearing: false
    };
  }

  var $ = function(id){ return document.getElementById(id); };
  var waveNumEl = $('waveNum'), waveSubEl = $('waveSub');
  var playerHpFill = $('playerHpFill'), playerHpText = $('playerHpText');
  var enemyHpFill = $('enemyHpFill'), enemyHpText = $('enemyHpText');
  var enemiesEl = $('enemies');
  var playerEl = $('player'), playerGunHold = $('playerGunHold');
  var gridEl = $('grid'), trayEl = $('tray');
  var statDmg = $('statDmg'), statAcc = $('statAcc'), statCrit = $('statCrit'), statRate = $('statRate'), statPierce = $('statPierce');
  var startScreen = $('startScreen'), gameOverScreen = $('gameOverScreen'), goStats = $('goStats');

  function currentWeapon(){ return TIERS[state.equipTier-1]; }

  function renderStats(){
    var w = currentWeapon();
    statDmg.textContent = w.dmg;
    statAcc.textContent = Math.round(w.acc*100)+'%';
    statCrit.textContent = w.crit+'%';
    statRate.textContent = w.rate+'%';
    statPierce.textContent = w.pierce+'%';
    playerGunHold.innerHTML = gunSVG(state.equipTier);
  }

  function renderPlayerArt(){
    playerEl.innerHTML = catSVG();
  }

  function renderPlayerHp(){
    var pct = Math.max(0, state.playerHp/state.playerHpMax*100);
    playerHpFill.style.width = pct+'%';
    playerHpText.textContent = Math.max(0,Math.round(state.playerHp));
  }

  function totalEnemyHp(){
    var cur=0, max=0;
    state.enemies.forEach(function(e){ if(e.hp>0){ cur+=e.hp; } max+=e.maxHp; });
    return {cur:cur, max:max};
  }

  function renderEnemyHp(){
    var t = totalEnemyHp();
    var pct = t.max>0 ? Math.max(0, t.cur/t.max*100) : 0;
    enemyHpFill.style.width = pct+'%';
    enemyHpText.textContent = Math.max(0,Math.round(t.cur));
  }

  function renderEnemies(){
    enemiesEl.innerHTML = '';
    var size = Math.max(44, Math.min(76, Math.floor(300 / Math.max(1,state.enemies.length))));
    state.enemies.forEach(function(e){
      var d = document.createElement('div');
      d.className = 'enemy' + (e.hp<=0 ? ' dead' : '');
      d.dataset.id = e.id;
      d.style.width = size+'px';
      d.style.height = size+'px';
      d.innerHTML = '<div class="ehp">'+Math.max(0,Math.round(e.hp))+'</div><div class="art">'+e.art+'</div>';
      enemiesEl.appendChild(d);
    });
  }

  function updateEnemyDom(e){
    var d = enemiesEl.querySelector('[data-id="'+e.id+'"]');
    if(!d) return;
    var hpTag = d.querySelector('.ehp');
    if(hpTag) hpTag.textContent = Math.max(0,Math.round(e.hp));
    if(e.hp<=0) d.classList.add('dead');
  }

  function flashHit(e){
    var d = enemiesEl.querySelector('[data-id="'+e.id+'"]');
    if(!d) return;
    d.classList.add('hit');
    setTimeout(function(){ d.classList.remove('hit'); }, 150);
  }

  function floatText(targetEl, text, cls){
    if(!targetEl) return;
    var f = document.createElement('div');
    f.className = 'float' + (cls?(' '+cls):'');
    f.textContent = text;
    f.style.left = (30 + Math.random()*20) + '%';
    f.style.top = '-6px';
    targetEl.style.position = 'relative';
    targetEl.appendChild(f);
    setTimeout(function(){ f.remove(); }, 820);
  }

  function muzzleFlash(){
    var m = document.createElement('div');
    m.className = 'muzzle';
    document.getElementById('playerSide').appendChild(m);
    setTimeout(function(){ m.remove(); }, 150);
  }

  function renderBoard(){
    gridEl.innerHTML = '';
    var equip = document.createElement('div');
    equip.className = 'slot equip';
    equip.dataset.role = 'equip';
    equip.innerHTML = '<div class="gunbox">'+gunSVG(state.equipTier)+'</div>';
    gridEl.appendChild(equip);
    attachDragHandlers(equip, {kind:'equip'});

    state.board.forEach(function(frag, i){
      var s = document.createElement('div');
      s.className = 'slot';
      s.dataset.role = 'board';
      s.dataset.idx = i;
      if(frag){ s.innerHTML = '<div class="frag">'+gunSVG(frag.tier, true)+'</div>'; }
      gridEl.appendChild(s);
      attachDragHandlers(s, {kind:'board', idx:i});
    });

    trayEl.innerHTML = '';
    state.tray.forEach(function(frag, i){
      var s = document.createElement('div');
      s.className = 'slot';
      s.dataset.role = 'tray';
      s.dataset.idx = i;
      if(frag){ s.innerHTML = '<div class="frag">'+gunSVG(frag.tier, true)+'</div>'; }
      trayEl.appendChild(s);
      attachDragHandlers(s, {kind:'tray', idx:i});
    });
  }

  function getFragAt(ref){
    if(ref.kind==='board') return state.board[ref.idx];
    if(ref.kind==='tray') return state.tray[ref.idx];
    return null;
  }
  function setFragAt(ref, val){
    if(ref.kind==='board') state.board[ref.idx] = val;
    else if(ref.kind==='tray') state.tray[ref.idx] = val;
  }
  function findEmptySlot(){
    for(var i=0;i<state.tray.length;i++){ if(!state.tray[i]) return {kind:'tray', idx:i}; }
    for(var j=0;j<state.board.length;j++){ if(!state.board[j]) return {kind:'board', idx:j}; }
    return null;
  }

  function spawnFragmentDrop(){
    var slot = findEmptySlot();
    if(!slot) return;
    var maxDropTier = Math.max(1, Math.min(state.equipTier, MAX_TIER-1));
    var tier = 1 + Math.floor(Math.random()*Math.min(2,maxDropTier));
    setFragAt(slot, {tier: Math.max(1,tier)});
  }

  var dragCtx = null;

  function attachDragHandlers(el, ref){
    if(ref.kind==='equip') return;
    el.addEventListener('pointerdown', function(ev){
      var frag = getFragAt(ref);
      if(!frag) return;
      ev.preventDefault();
      var clone = document.createElement('div');
      clone.className = 'dragClone';
      clone.innerHTML = gunSVG(frag.tier, true);
      document.body.appendChild(clone);
      clone.style.left = ev.clientX+'px';
      clone.style.top = ev.clientY+'px';
      el.classList.add('dragging-src');

      dragCtx = { ref: ref, frag: frag, clone: clone };

      function move(e2){
        clone.style.left = e2.clientX+'px';
        clone.style.top = e2.clientY+'px';
        clearTargetHighlights();
        var target = elementSlotUnder(e2.clientX, e2.clientY);
        if(target) highlightTarget(target);
      }
      function up(e2){
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        clearTargetHighlights();
        clone.remove();
        el.classList.remove('dragging-src');
        var target = elementSlotUnder(e2.clientX, e2.clientY);
        if(target) handleDrop(ref, target);
        dragCtx = null;
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }

  function elementSlotUnder(x,y){
    var el = document.elementFromPoint(x,y);
    if(!el) return null;
    var slotEl = el.closest ? el.closest('.slot') : null;
    if(!slotEl) return null;
    var role = slotEl.dataset.role;
    if(role==='equip') return {kind:'equip', el:slotEl};
    if(role==='board') return {kind:'board', idx: +slotEl.dataset.idx, el:slotEl};
    if(role==='tray') return {kind:'tray', idx: +slotEl.dataset.idx, el:slotEl};
    return null;
  }

  function clearTargetHighlights(){
    document.querySelectorAll('.slot.drop-target,.slot.drop-reject').forEach(function(s){
      s.classList.remove('drop-target','drop-reject');
    });
  }
  function highlightTarget(target){
    if(!target.el) return;
    var ok = canDrop(target);
    target.el.classList.add(ok ? 'drop-target' : 'drop-reject');
  }

  function canDrop(target){
    if(!dragCtx) return false;
    if(target.kind==='equip'){
      return dragCtx.frag.tier === state.equipTier && state.equipTier < MAX_TIER;
    }
    if(target.kind==='board' || target.kind==='tray'){
      var existing = getFragAt(target);
      if(!existing) return true;
      return existing.tier === dragCtx.frag.tier && dragCtx.frag.tier < MAX_TIER;
    }
    return false;
  }

  function handleDrop(sourceRef, target){
    if(!canDrop(target)){ renderBoard(); return; }
    if(target.kind==='equip'){
      state.equipTier = Math.min(MAX_TIER, state.equipTier+1);
      setFragAt(sourceRef, null);
      renderStats();
      popUpgradeFx();
    } else {
      var existing = getFragAt(target);
      if(existing){
        setFragAt(target, {tier: existing.tier+1});
        setFragAt(sourceRef, null);
      } else {
        var frag = getFragAt(sourceRef);
        setFragAt(target, frag);
        setFragAt(sourceRef, null);
      }
    }
    renderBoard();
  }

  function popUpgradeFx(){
    waveSubEl.textContent = currentWeapon().name + '!';
    waveSubEl.style.opacity = '1';
    setTimeout(function(){ waveSubEl.style.opacity = '0'; }, 900);
  }

  var tickHandle = null;
  var enemyIdCounter = 0;

  function spawnWave(){
    state.enemies = [];
    var count = Math.min(10, 3 + state.wave);
    var scale = 1 + (state.wave-1)*0.32;
    for(var i=0;i<count;i++){
      var type = ENEMY_TYPES[Math.min(ENEMY_TYPES.length-1, Math.floor(Math.random()*Math.min(ENEMY_TYPES.length, 1+Math.floor(state.wave/2))))];
      var hp = Math.round(type.hp*scale);
      state.enemies.push({
        id: ++enemyIdCounter,
        art: type.draw(),
        hp: hp, maxHp: hp,
        dmg: type.dmg,
        nextAttack: performance.now() + 800 + Math.random()*1600
      });
    }
    waveNumEl.textContent = state.wave;
    renderEnemies();
    renderEnemyHp();
  }

  function frontEnemyIndex(){
    for(var i=0;i<state.enemies.length;i++){ if(state.enemies[i].hp>0) return i; }
    return -1;
  }

  function playerShoot(now){
    var w = currentWeapon();
    var interval = 1000 / (w.rate/100);
    if(now - state.lastPlayerShot < interval) return;
    state.lastPlayerShot = now;

    var idx = frontEnemyIndex();
    if(idx===-1) return;
    muzzleFlash();

    var targets = [state.enemies[idx]];
    if(w.pierce>0 && Math.random()*100 < w.pierce){
      for(var j=idx+1;j<state.enemies.length;j++){
        if(state.enemies[j].hp>0){ targets.push(state.enemies[j]); break; }
      }
    }

    targets.forEach(function(e){
      var hit = Math.random() < w.acc;
      var dEl = enemiesEl.querySelector('[data-id="'+e.id+'"]');
      if(!hit){ floatText(dEl, 'MISS', 'miss'); return; }
      var crit = Math.random()*100 < w.crit;
      var dmg = crit ? Math.round(w.dmg*1.8) : w.dmg;
      e.hp -= dmg;
      flashHit(e);
      floatText(dEl, (crit?'KRİTİK ':'')+dmg, crit?'crit':'');
      updateEnemyDom(e);
    });
    renderEnemyHp();
  }

  function enemyAttacks(now){
    for(var i=0;i<state.enemies.length;i++){
      var e = state.enemies[i];
      if(e.hp<=0) continue;
      if(now >= e.nextAttack){
        state.playerHp -= e.dmg;
        e.nextAttack = now + 1400 + Math.random()*1600;
        var pEl = document.getElementById('playerSide');
        floatText(pEl, '-'+e.dmg, 'miss');
      }
    }
    renderPlayerHp();
    if(state.playerHp<=0){ endGame(); }
  }

  function allEnemiesDead(){
    return state.enemies.every(function(e){ return e.hp<=0; });
  }

  function loop(now){
    if(!state.running) return;
    if(!state.waveClearing){
      playerShoot(now);
      enemyAttacks(now);
      if(allEnemiesDead()){
        state.waveClearing = true;
        waveSubEl.textContent = 'Dalga Temizlendi!';
        waveSubEl.style.opacity = '1';
        var drops = 1 + Math.floor(Math.random()*2);
        for(var i=0;i<drops;i++) spawnFragmentDrop();
        renderBoard();
        setTimeout(function(){
          waveSubEl.style.opacity = '0';
          state.wave++;
          spawnWave();
          state.waveClearing = false;
        }, 1100);
      }
    }
    tickHandle = requestAnimationFrame(loop);
  }

  function endGame(){
    state.running = false;
    if(tickHandle) cancelAnimationFrame(tickHandle);
    goStats.textContent = 'Dalga ' + state.wave + ' — ' + currentWeapon().name + ' silahına ulaştın.';
    gameOverScreen.hidden = false;
  }

  function startGame(){
    state = freshState();
    renderPlayerArt();
    renderStats();
    renderPlayerHp();
    renderBoard();
    spawnWave();
    startScreen.hidden = true;
    gameOverScreen.hidden = true;
    state.running = true;
    state.lastPlayerShot = performance.now();
    tickHandle = requestAnimationFrame(loop);
  }

  $('startBtn').addEventListener('click', startGame);
  $('restartBtn').addEventListener('click', startGame);

  state = freshState();
  renderStats();
  renderPlayerHp();
  renderBoard();
})();
</script>
</body>
</html>
