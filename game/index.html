<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Merge Gun: Wave Defense</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111;
    touch-action: none;
  }
  #app {
    position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto;
    background: #222; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---------- Battlefield ---------- */
  #battlefield {
    position: relative; flex: 0 0 46%; overflow: hidden;
    background: linear-gradient(to bottom, #8fd3f4 0%, #a9e0f5 60%, #b9e6c9 60%, #b9e6c9 100%);
  }
  #trees {
    position: absolute; right: 4%; top: 8%; font-size: 40px; line-height: 1; opacity: .9;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.05));
  }
  #waveBanner {
    position: absolute; top: 10px; left: 0; right: 0; text-align: center;
    font-size: 30px; font-weight: 800; color: #fff;
    -webkit-text-stroke: 3px #2a2a2a; paint-order: stroke fill;
    z-index: 20; transition: opacity .3s;
  }
  #waveSub {
    position: absolute; top: 46px; left: 0; right: 0; text-align: center;
    font-size: 13px; font-weight: 700; color: #fff; -webkit-text-stroke: 2px #2a2a2a; paint-order: stroke fill;
    z-index: 20;
  }
  #ground {
    position: absolute; left: 0; right: 0; bottom: 0; top: 55%;
    display: flex;
  }
  .side { position: relative; flex: 1; height: 100%; }
  .side.green { background: #a3c93a; }
  .side.red { background: #d84f4f; }
  #ground::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -14%; height: 30%;
    background: #8a5a34; z-index: -1;
  }
  #dirt {
    position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #8a5a34;
  }
  .hpbar {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 78%; max-width: 160px; height: 18px; background: #000; border-radius: 5px;
    border: 2px solid #000; overflow: hidden; z-index: 5;
  }
  .hpbar .fill { height: 100%; background: #58d858; transition: width .25s; }
  .hpbar.enemy .fill { background: #e23c3c; }
  .hpbar .hptext {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 700;
  }
  #player {
    position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%) scaleX(-1);
    font-size: 54px; z-index: 4; transition: transform .1s;
  }
  #playerGunTag {
    position: absolute; bottom: 16%; left: 62%; width: 46px; height: 26px; z-index: 5; pointer-events: none;
  }
  #enemies {
    position: absolute; bottom: 6%; left: 0; right: 0; display: flex; justify-content: center;
    flex-wrap: wrap-reverse; gap: 2px 6px; padding: 0 6px; z-index: 3;
  }
  .enemy {
    position: relative; font-size: 34px; text-align: center; transition: opacity .25s, transform .15s;
  }
  .enemy .ehp {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: #000; color: #fff; border-radius: 4px; font-size: 9px; font-weight: 700;
    padding: 1px 4px; white-space: nowrap; border: 1px solid #700;
  }
  .enemy.hit { transform: scale(1.15); filter: brightness(1.6); }
  .enemy.dead { opacity: 0; transform: scale(.4) translateY(10px); }
  .float {
    position: absolute; font-weight: 800; font-size: 15px; color: #fff;
    -webkit-text-stroke: 2px #333; paint-order: stroke fill;
    pointer-events: none; animation: floatUp .8s ease-out forwards; z-index: 30;
  }
  .float.crit { color: #ffd23c; font-size: 19px; }
  .float.miss { color: #ccc; font-style: italic; }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-38px); }
  }
  .muzzle {
    position: absolute; bottom: 30%; left: 58%; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle, #fff6c0, #ffb020 60%, transparent 70%);
    animation: flash .12s ease-out forwards; z-index: 6; pointer-events: none;
  }
  @keyframes flash { from{opacity:1; transform:scale(1);} to{opacity:0; transform:scale(1.8);} }

  #clearedBanner, #startScreen, #gameOverScreen {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); color: #fff; z-index: 50; text-align: center; padding: 20px;
  }
  #clearedBanner { background: rgba(0,0,0,.35); font-size: 26px; font-weight: 800; }
  #startScreen[hidden], #gameOverScreen[hidden] { display: none; }
  #startScreen h1, #gameOverScreen h1 { font-size: 26px; margin: 0 0 6px; }
  #startScreen p, #gameOverScreen p { font-size: 13px; opacity: .85; margin: 0 0 18px; max-width: 300px; }
  .bigBtn {
    background: #58d858; color: #fff; border: none; border-radius: 12px; padding: 14px 34px;
    font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 #2f8f2f; cursor: pointer;
  }
  .bigBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2f8f2f; }

  /* ---------- HUD ---------- */
  #hud { flex: 1; background: #b98a52; display: flex; flex-direction: column; padding: 8px 10px 12px; overflow: hidden; }
  #statsRow {
    display: flex; justify-content: space-between; background: #cfe8f0; border-radius: 12px 12px 0 0;
    padding: 6px 4px 4px; font-size: 10px; font-weight: 700; color: #2a5a66;
  }
  #statsRow .stat { flex: 1; text-align: center; }
  #statsRow .stat .ic { font-size: 15px; display: block; }
  #boardWrap {
    background: #eaf7fb; border-radius: 0 0 12px 12px; padding: 6px; flex: 1; display: flex; flex-direction: column;
    min-height: 0;
  }
  #grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; flex: 1; min-height: 0;
  }
  .slot {
    position: relative; background: #d7eef5; border-radius: 6px; aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .slot.equip { background: #c3e6f2; outline: 2px dashed #7fb8cc; }
  .slot .gunbox { width: 88%; height: 88%; pointer-events: none; }
  .slot .frag { width: 70%; height: 70%; pointer-events: none; }
  .slot .count {
    position: absolute; bottom: 1px; right: 3px; font-size: 11px; font-weight: 800; color: #2a5a66;
    background: rgba(255,255,255,.8); border-radius: 4px; padding: 0 3px;
  }
  .slot.dragging-src { opacity: .25; }
  .slot.drop-target { outline: 2px solid #58d858; }
  .slot.drop-reject { outline: 2px solid #e23c3c; }
  #tray {
    display: flex; gap: 4px; margin-top: 6px; padding: 4px; background: #9c7141; border-radius: 10px;
    min-height: 40px;
  }
  #tray .slot { background: #f2f2f2; flex: 1; max-width: 15%; }
  .dragClone {
    position: fixed; width: 46px; height: 46px; pointer-events: none; z-index: 999; opacity: .9;
    transform: translate(-50%,-50%);
  }
  .footerLinks { text-align: center; padding: 4px; font-size: 10px; }
  .footerLinks a { color: #eee; margin: 0 6px; }
</style>
</head>
<body>
<div id="app">

  <div id="battlefield">
    <div id="trees">🌲🌳🌲</div>
    <div id="waveBanner">Wave <span id="waveNum">1</span></div>
    <div id="waveSub"></div>

    <div id="ground">
      <div class="side green" id="playerSide">
        <div class="hpbar" id="playerHpBar"><div class="fill" id="playerHpFill"></div><span class="hptext" id="playerHpText"></span></div>
        <div id="player">🐱</div>
      </div>
      <div class="side red" id="enemySide">
        <div class="hpbar enemy" id="enemyHpBar"><div class="fill" id="enemyHpFill"></div><span class="hptext" id="enemyHpText"></span></div>
        <div id="enemies"></div>
      </div>
    </div>

    <div id="startScreen">
      <h1>🐱 Merge Gun: Wave Defense</h1>
      <p>Kedini savunmaya hazırla! Düşman dalgalarını alt et, silah parçalarını birleştir (merge) ve topunu güçlendir.</p>
      <button class="bigBtn" id="startBtn">OYNA</button>
    </div>

    <div id="gameOverScreen" hidden>
      <h1>💀 Kaybettin</h1>
      <p id="goStats"></p>
      <button class="bigBtn" id="restartBtn">TEKRAR OYNA</button>
    </div>
  </div>

  <div id="hud">
    <div id="statsRow">
      <div class="stat"><span class="ic">⚔️</span><span id="statDmg">0</span></div>
      <div class="stat"><span class="ic">🎯</span><span id="statAcc">0%</span></div>
      <div class="stat"><span class="ic">💥</span><span id="statCrit">0%</span></div>
      <div class="stat"><span class="ic">🔥</span><span id="statRate">0%</span></div>
      <div class="stat"><span class="ic">🪶</span><span id="statPierce">0%</span></div>
    </div>
    <div id="boardWrap">
      <div id="grid"></div>
      <div id="tray"></div>
    </div>
  </div>

  <div class="footerLinks"><a href="../privacy.html">Privacy</a> · <a href="../terms.html">Terms</a></div>
</div>

<script>
(function(){
  "use strict";

  // ---------------- Weapon tiers ----------------
  var TIERS = [
    { name:'Pistol',           dmg:285,  acc:.85, crit:0,  rate:150, pierce:0  },
    { name:'Auto Pistol',      dmg:400,  acc:.90, crit:0,  rate:150, pierce:0  },
    { name:'Marksman Rifle',   dmg:510,  acc:.94, crit:0,  rate:150, pierce:0  },
    { name:'Battle Carbine',   dmg:650,  acc:.94, crit:3,  rate:150, pierce:10 },
    { name:'Assault Rifle',    dmg:810,  acc:.94, crit:7,  rate:150, pierce:20 },
    { name:'Heavy SMG',        dmg:1000, acc:.96, crit:10, rate:160, pierce:25 },
    { name:'Battle Rifle',     dmg:1300, acc:.97, crit:14, rate:170, pierce:30 },
    { name:'Marksman Elite',   dmg:1650, acc:.98, crit:18, rate:180, pierce:35 },
    { name:'Combat Railgun',   dmg:2100, acc:.99, crit:22, rate:190, pierce:40 },
    { name:'Annihilator',      dmg:2700, acc:.99, crit:26, rate:200, pierce:45 }
  ];
  var MAX_TIER = TIERS.length; // 1-indexed tiers, 1..MAX_TIER

  function gunSVG(tier, muted){
    var barrelLen = 34 + tier*8;
    var hasScope = tier>=2, hasMag = tier>=3, hasRail = tier>=4, hasBipod = tier>=6;
    var bodyColor = tier>=7 ? '#4a4a5a' : tier>=4 ? '#6b6b7a' : '#8a8a95';
    var stockColor = muted ? '#c9986a' : '#d97a3c';
    return '<svg viewBox="0 0 160 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="8" y="58" width="30" height="14" fill="'+stockColor+'" rx="2"/>' +
      '<rect x="34" y="47" width="45" height="18" fill="'+bodyColor+'" rx="3"/>' +
      '<rect x="74" y="52" width="'+barrelLen+'" height="7" fill="#555" rx="2"/>' +
      '<rect x="44" y="62" width="8" height="20" fill="#333" rx="2"/>' +
      (hasMag ? '<rect x="56" y="65" width="9" height="18" fill="#333" rx="2" transform="rotate(12 60 65)"/>' : '') +
      (hasScope ? '<rect x="44" y="37" width="34" height="6" fill="#333" rx="2"/><circle cx="78" cy="32" r="6" fill="none" stroke="#333" stroke-width="3"/><circle cx="54" cy="32" r="4" fill="none" stroke="#333" stroke-width="3"/>' : '') +
      (hasRail ? '<rect x="78" y="46" width="18" height="4" fill="#222"/>' : '') +
      (hasBipod ? '<line x1="92" y1="59" x2="86" y2="82" stroke="#333" stroke-width="3"/><line x1="102" y1="59" x2="108" y2="82" stroke="#333" stroke-width="3"/>' : '') +
      '</svg>';
  }

  // ---------------- Enemy types ----------------
  var ENEMY_TYPES = [
    { emoji:'🐔', hp:40,  dmg:3 },
    { emoji:'🐐', hp:70,  dmg:5 },
    { emoji:'🦖', hp:130, dmg:8 },
    { emoji:'🐂', hp:220, dmg:12 }
  ];

  // ---------------- Game state ----------------
  var state = null;

  function freshState(){
    return {
      wave: 1,
      playerHpMax: 300,
      playerHp: 300,
      equipTier: 1,
      board: new Array(18).fill(null),   // 3 rows x 6 cols grid (fragments)
      tray: new Array(5).fill(null),     // bottom drop tray
      enemies: [],
      lastPlayerShot: 0,
      running: false,
      waveClearing: false
    };
  }

  // ---------------- DOM refs ----------------
  var $ = function(id){ return document.getElementById(id); };
  var waveNumEl = $('waveNum'), waveSubEl = $('waveSub');
  var playerHpFill = $('playerHpFill'), playerHpText = $('playerHpText');
  var enemyHpFill = $('enemyHpFill'), enemyHpText = $('enemyHpText');
  var enemiesEl = $('enemies'), playerEl = $('player'), enemySideEl = $('enemySide');
  var gridEl = $('grid'), trayEl = $('tray');
  var statDmg = $('statDmg'), statAcc = $('statAcc'), statCrit = $('statCrit'), statRate = $('statRate'), statPierce = $('statPierce');
  var startScreen = $('startScreen'), gameOverScreen = $('gameOverScreen'), goStats = $('goStats');

  // ---------------- Rendering ----------------
  function currentWeapon(){ return TIERS[state.equipTier-1]; }

  function renderStats(){
    var w = currentWeapon();
    statDmg.textContent = w.dmg;
    statAcc.textContent = Math.round(w.acc*100)+'%';
    statCrit.textContent = w.crit+'%';
    statRate.textContent = w.rate+'%';
    statPierce.textContent = w.pierce+'%';
  }

  function renderPlayerHp(){
    var pct = Math.max(0, state.playerHp/state.playerHpMax*100);
    playerHpFill.style.width = pct+'%';
    playerHpText.textContent = Math.max(0,Math.round(state.playerHp));
  }

  function totalEnemyHp(){
    var cur=0, max=0;
    state.enemies.forEach(function(e){ if(e.hp>0){ cur+=e.hp; } max+=e.maxHp; });
    return {cur:cur, max:max};
  }

  function renderEnemyHp(){
    var t = totalEnemyHp();
    var pct = t.max>0 ? Math.max(0, t.cur/t.max*100) : 0;
    enemyHpFill.style.width = pct+'%';
    enemyHpText.textContent = Math.max(0,Math.round(t.cur));
  }

  function renderEnemies(){
    enemiesEl.innerHTML = '';
    state.enemies.forEach(function(e){
      var d = document.createElement('div');
      d.className = 'enemy' + (e.hp<=0 ? ' dead' : '');
      d.dataset.id = e.id;
      d.innerHTML = '<div class="ehp">'+Math.max(0,Math.round(e.hp))+'</div><div>'+e.emoji+'</div>';
      enemiesEl.appendChild(d);
    });
  }

  function updateEnemyDom(e){
    var d = enemiesEl.querySelector('[data-id="'+e.id+'"]');
    if(!d) return;
    var hpTag = d.querySelector('.ehp');
    if(hpTag) hpTag.textContent = Math.max(0,Math.round(e.hp));
    if(e.hp<=0) d.classList.add('dead');
  }

  function flashHit(e){
    var d = enemiesEl.querySelector('[data-id="'+e.id+'"]');
    if(!d) return;
    d.classList.add('hit');
    setTimeout(function(){ d.classList.remove('hit'); }, 150);
  }

  function floatText(targetEl, text, cls){
    if(!targetEl) return;
    var f = document.createElement('div');
    f.className = 'float' + (cls?(' '+cls):'');
    f.textContent = text;
    f.style.left = (30 + Math.random()*20) + '%';
    f.style.top = '-6px';
    targetEl.style.position = 'relative';
    targetEl.appendChild(f);
    setTimeout(function(){ f.remove(); }, 820);
  }

  function muzzleFlash(){
    var m = document.createElement('div');
    m.className = 'muzzle';
    document.getElementById('playerSide').appendChild(m);
    setTimeout(function(){ m.remove(); }, 150);
  }

  // ---------------- Board / merge rendering ----------------
  function renderBoard(){
    gridEl.innerHTML = '';
    // equip slot first (index -1 conceptually), then 17 board slots
    var equip = document.createElement('div');
    equip.className = 'slot equip';
    equip.dataset.role = 'equip';
    equip.innerHTML = '<div class="gunbox">'+gunSVG(state.equipTier)+'</div>';
    gridEl.appendChild(equip);
    attachDragHandlers(equip, {kind:'equip'});

    state.board.forEach(function(frag, i){
      var s = document.createElement('div');
      s.className = 'slot';
      s.dataset.role = 'board';
      s.dataset.idx = i;
      if(frag){
        s.innerHTML = '<div class="frag">'+gunSVG(frag.tier, true)+'</div>';
      }
      gridEl.appendChild(s);
      attachDragHandlers(s, {kind:'board', idx:i});
    });

    trayEl.innerHTML = '';
    state.tray.forEach(function(frag, i){
      var s = document.createElement('div');
      s.className = 'slot';
      s.dataset.role = 'tray';
      s.dataset.idx = i;
      if(frag){
        s.innerHTML = '<div class="frag">'+gunSVG(frag.tier, true)+'</div>';
      }
      trayEl.appendChild(s);
      attachDragHandlers(s, {kind:'tray', idx:i});
    });
  }

  function getFragAt(ref){
    if(ref.kind==='board') return state.board[ref.idx];
    if(ref.kind==='tray') return state.tray[ref.idx];
    return null;
  }
  function setFragAt(ref, val){
    if(ref.kind==='board') state.board[ref.idx] = val;
    else if(ref.kind==='tray') state.tray[ref.idx] = val;
  }
  function findEmptySlot(){
    for(var i=0;i<state.tray.length;i++){ if(!state.tray[i]) return {kind:'tray', idx:i}; }
    for(var j=0;j<state.board.length;j++){ if(!state.board[j]) return {kind:'board', idx:j}; }
    return null;
  }

  function spawnFragmentDrop(){
    var slot = findEmptySlot();
    if(!slot) return;
    var maxDropTier = Math.max(1, Math.min(state.equipTier, MAX_TIER-1));
    var tier = 1 + Math.floor(Math.random()*Math.min(2,maxDropTier));
    setFragAt(slot, {tier: Math.max(1,tier)});
  }

  // ---------------- Drag & drop (pointer events) ----------------
  var dragCtx = null;

  function attachDragHandlers(el, ref){
    if(ref.kind==='equip') return; // equip slot is only a drop target, not draggable
    el.addEventListener('pointerdown', function(ev){
      var frag = getFragAt(ref);
      if(!frag) return;
      ev.preventDefault();
      var clone = document.createElement('div');
      clone.className = 'dragClone';
      clone.innerHTML = gunSVG(frag.tier, true);
      document.body.appendChild(clone);
      clone.style.left = ev.clientX+'px';
      clone.style.top = ev.clientY+'px';
      el.classList.add('dragging-src');

      dragCtx = { ref: ref, frag: frag, clone: clone };

      function move(e2){
        clone.style.left = e2.clientX+'px';
        clone.style.top = e2.clientY+'px';
        clearTargetHighlights();
        var target = elementSlotUnder(e2.clientX, e2.clientY);
        if(target) highlightTarget(target);
      }
      function up(e2){
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        clearTargetHighlights();
        clone.remove();
        el.classList.remove('dragging-src');
        var target = elementSlotUnder(e2.clientX, e2.clientY);
        if(target) handleDrop(ref, target);
        dragCtx = null;
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }

  function elementSlotUnder(x,y){
    var el = document.elementFromPoint(x,y);
    if(!el) return null;
    var slotEl = el.closest ? el.closest('.slot') : null;
    if(!slotEl) return null;
    var role = slotEl.dataset.role;
    if(role==='equip') return {kind:'equip', el:slotEl};
    if(role==='board') return {kind:'board', idx: +slotEl.dataset.idx, el:slotEl};
    if(role==='tray') return {kind:'tray', idx: +slotEl.dataset.idx, el:slotEl};
    return null;
  }

  function clearTargetHighlights(){
    document.querySelectorAll('.slot.drop-target,.slot.drop-reject').forEach(function(s){
      s.classList.remove('drop-target','drop-reject');
    });
  }
  function highlightTarget(target){
    if(!target.el) return;
    var ok = canDrop(target);
    target.el.classList.add(ok ? 'drop-target' : 'drop-reject');
  }

  function canDrop(target){
    if(!dragCtx) return false;
    if(target.kind==='equip'){
      return dragCtx.frag.tier === state.equipTier && state.equipTier < MAX_TIER;
    }
    if(target.kind==='board' || target.kind==='tray'){
      var existing = getFragAt(target);
      if(!existing) return true;
      return existing.tier === dragCtx.frag.tier && dragCtx.frag.tier < MAX_TIER;
    }
    return false;
  }

  function handleDrop(sourceRef, target){
    if(!canDrop(target)){ renderBoard(); return; }
    if(target.kind==='equip'){
      state.equipTier = Math.min(MAX_TIER, state.equipTier+1);
      setFragAt(sourceRef, null);
      renderStats();
      popUpgradeFx();
    } else {
      var existing = getFragAt(target);
      if(existing){
        setFragAt(target, {tier: existing.tier+1});
        setFragAt(sourceRef, null);
      } else {
        var frag = getFragAt(sourceRef);
        setFragAt(target, frag);
        setFragAt(sourceRef, null);
      }
    }
    renderBoard();
  }

  function popUpgradeFx(){
    waveSubEl.textContent = currentWeapon().name + '!';
    waveSubEl.style.opacity = '1';
    setTimeout(function(){ waveSubEl.style.opacity = '0'; }, 900);
  }

  // ---------------- Combat loop ----------------
  var tickHandle = null;
  var enemyIdCounter = 0;

  function spawnWave(){
    state.enemies = [];
    var count = Math.min(10, 3 + state.wave);
    var scale = 1 + (state.wave-1)*0.32;
    for(var i=0;i<count;i++){
      var type = ENEMY_TYPES[Math.min(ENEMY_TYPES.length-1, Math.floor(Math.random()*Math.min(ENEMY_TYPES.length, 1+Math.floor(state.wave/2))))];
      var hp = Math.round(type.hp*scale);
      state.enemies.push({
        id: ++enemyIdCounter,
        emoji: type.emoji,
        hp: hp, maxHp: hp,
        dmg: type.dmg,
        nextAttack: performance.now() + 800 + Math.random()*1600
      });
    }
    waveNumEl.textContent = state.wave;
    renderEnemies();
    renderEnemyHp();
  }

  function frontEnemyIndex(){
    for(var i=0;i<state.enemies.length;i++){ if(state.enemies[i].hp>0) return i; }
    return -1;
  }

  function playerShoot(now){
    var w = currentWeapon();
    var interval = 1000 / (w.rate/100);
    if(now - state.lastPlayerShot < interval) return;
    state.lastPlayerShot = now;

    var idx = frontEnemyIndex();
    if(idx===-1) return;
    muzzleFlash();

    var targets = [state.enemies[idx]];
    if(w.pierce>0 && Math.random()*100 < w.pierce){
      for(var j=idx+1;j<state.enemies.length;j++){
        if(state.enemies[j].hp>0){ targets.push(state.enemies[j]); break; }
      }
    }

    targets.forEach(function(e){
      var hit = Math.random() < w.acc;
      var dEl = enemiesEl.querySelector('[data-id="'+e.id+'"]');
      if(!hit){
        floatText(dEl, 'MISS', 'miss');
        return;
      }
      var crit = Math.random()*100 < w.crit;
      var dmg = crit ? Math.round(w.dmg*1.8) : w.dmg;
      e.hp -= dmg;
      flashHit(e);
      floatText(dEl, (crit?'CRIT ':'')+dmg, crit?'crit':'');
      updateEnemyDom(e);
    });
    renderEnemyHp();
  }

  function enemyAttacks(now){
    for(var i=0;i<state.enemies.length;i++){
      var e = state.enemies[i];
      if(e.hp<=0) continue;
      if(now >= e.nextAttack){
        state.playerHp -= e.dmg;
        e.nextAttack = now + 1400 + Math.random()*1600;
        var pEl = document.getElementById('playerSide');
        floatText(pEl, '-'+e.dmg, 'miss');
      }
    }
    renderPlayerHp();
    if(state.playerHp<=0){ endGame(); }
  }

  function allEnemiesDead(){
    return state.enemies.every(function(e){ return e.hp<=0; });
  }

  function loop(now){
    if(!state.running) return;
    if(!state.waveClearing){
      playerShoot(now);
      enemyAttacks(now);
      if(allEnemiesDead()){
        state.waveClearing = true;
        waveSubEl.textContent = 'Wave Cleared!';
        waveSubEl.style.opacity = '1';
        var drops = 1 + Math.floor(Math.random()*2);
        for(var i=0;i<drops;i++) spawnFragmentDrop();
        renderBoard();
        setTimeout(function(){
          waveSubEl.style.opacity = '0';
          state.wave++;
          spawnWave();
          state.waveClearing = false;
        }, 1100);
      }
    }
    tickHandle = requestAnimationFrame(loop);
  }

  function endGame(){
    state.running = false;
    if(tickHandle) cancelAnimationFrame(tickHandle);
    goStats.textContent = 'Wave ' + state.wave + ' — ' + currentWeapon().name + ' silahına ulaştın.';
    gameOverScreen.hidden = false;
  }

  function startGame(){
    state = freshState();
    renderStats();
    renderPlayerHp();
    renderBoard();
    spawnWave();
    startScreen.hidden = true;
    gameOverScreen.hidden = true;
    state.running = true;
    state.lastPlayerShot = performance.now();
    tickHandle = requestAnimationFrame(loop);
  }

  $('startBtn').addEventListener('click', startGame);
  $('restartBtn').addEventListener('click', startGame);

  // initial static render for start screen background
  state = freshState();
  renderStats();
  renderPlayerHp();
  renderBoard();
})();
</script>
</body>
</html>
