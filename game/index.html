<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap Life - Tıkla ve Kazan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <div class="topbar">
    <div class="profile">
      <div class="avatar">🧑‍🍳</div>
      <div class="level-badge" id="levelBadge">1</div>
    </div>
    <div class="money-pill">
      <span class="coin">💰</span>
      <span id="moneyText">$0</span>
    </div>
    <div class="day-pill">
      <span id="dayText">Gün 1</span>
    </div>
  </div>

  <div class="statsbar">
    <div class="stat">
      <span class="stat-icon">❤️</span>
      <div class="bar"><div class="bar-fill health" id="healthFill"></div></div>
    </div>
    <div class="stat">
      <span class="stat-icon">⚡</span>
      <div class="bar"><div class="bar-fill energy" id="energyFill"></div></div>
    </div>
    <div class="stat">
      <span class="stat-icon">🍴</span>
      <div class="bar"><div class="bar-fill hunger" id="hungerFill"></div></div>
    </div>
  </div>

  <div class="topstrip"></div>

  <div class="scene" id="scene">

    <button class="quest-icon" id="questBtn" aria-label="Görevler">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <rect x="5" y="3" width="14" height="18" rx="2" fill="#fff" stroke="#7a5228" stroke-width="1.2"/>
        <rect x="9" y="1.5" width="6" height="3" rx="1.2" fill="#7a5228"/>
        <path d="M7.5 8.5 8.7 9.7 10.5 7.4" stroke="#3fb950" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12" y1="8.5" x2="16.5" y2="8.5" stroke="#c7c7c7" stroke-width="1.2"/>
        <path d="M7.5 13 8.7 14.2 10.5 11.9" stroke="#3fb950" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12" y1="13" x2="16.5" y2="13" stroke="#c7c7c7" stroke-width="1.2"/>
        <path d="M7 17 9 19 M9 17 7 19" stroke="#ef4444" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="12" y1="17.5" x2="16.5" y2="17.5" stroke="#c7c7c7" stroke-width="1.2"/>
      </svg>
    </button>

    <div class="tap-wrap">
      <div class="tap-stack" id="floaters"></div>
      <button class="tap-btn" id="tapBtn">
        <span id="tapLabel">TAP</span>
      </button>
    </div>

    <div class="furniture plant" id="plantBtn">
      <button class="upgrade-badge" id="plantUpgradeBtn">
        <span class="cost" id="plantCost">$250</span>
      </button>
      <svg viewBox="0 0 40 46" width="60" height="69">
        <path id="plantLeaf1" d="M20 28c-2-9-9-7-11-15 7 0 11 5 11 15z" fill="#3a9d4a"/>
        <path id="plantLeaf2" d="M20 28c2-11 11-9 12-19-8 1-12 8-12 19z" fill="#4cb85c"/>
        <path id="plantLeaf3" d="M20 28c-1-7-7-5-8-13 6 0 8 4 8 13z" fill="#5fcf6f"/>
        <g class="tierMin3">
          <path id="plantLeaf4" d="M20 28c3-8 10-6 13-12-6 0-11 4-13 12z" fill="#5fcf6f" opacity="0.9"/>
          <path id="plantLeaf5" d="M20 28c-3-6-9-4-12-9 5-1 10 2 12 9z" fill="#4cb85c" opacity="0.9"/>
        </g>
        <g class="tierMin4 plant-flowers">
          <circle cx="13" cy="13" r="2.1" fill="#ffd1e8"/>
          <circle cx="13" cy="13" r="0.9" fill="#ffe066"/>
          <circle cx="25" cy="9" r="1.8" fill="#ffd1e8"/>
          <circle cx="25" cy="9" r="0.8" fill="#ffe066"/>
        </g>
        <g class="tierMax2">
          <path id="plantPotBody" d="M9 28h22l-3 16H12z" fill="#b5651d"/>
          <rect id="plantPotRim" x="8" y="24" width="24" height="6" rx="1.5" fill="#8a4513"/>
        </g>
        <g class="tierMin3">
          <path id="plantPotBodyModern" d="M9 28h22l-2 15a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2z" fill="#8f8f96"/>
          <rect id="plantPotRimModern" x="8" y="25" width="24" height="5" rx="2" fill="#5c5c63"/>
          <rect class="tierMin4" x="8" y="25" width="24" height="1.4" fill="#ffe066" opacity="0.9"/>
        </g>
      </svg>
    </div>

    <div class="furniture bed" id="bedBtn">
      <button class="upgrade-badge" id="bedUpgradeBtn">
        <span class="cost" id="bedCost">$500</span>
      </button>
      <div class="bed-wrap">
        <div class="zzz-stack" id="zzz">
          <span>z</span><span>z</span><span>Z</span>
        </div>
        <svg viewBox="0 0 120 92" width="172" height="158" preserveAspectRatio="none">
          <defs>
            <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
              <stop id="woodStop1" offset="0%" stop-color="#a4713a"/>
              <stop id="woodStop2" offset="100%" stop-color="#6b4420"/>
            </linearGradient>
            <linearGradient id="blanketGrad" x1="0" y1="0" x2="0" y2="1">
              <stop id="blanketStop1" offset="0%" stop-color="#7cc6f5"/>
              <stop id="blanketStop2" offset="100%" stop-color="#3f8fd1"/>
            </linearGradient>
            <linearGradient id="pillowGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#dcdfe2"/>
            </linearGradient>
          </defs>
          <ellipse cx="60" cy="90" rx="56" ry="4" fill="#000" opacity="0.18"/>

          <!-- Tier 1: classic post-and-knob frame -->
          <g class="tierIs1">
            <rect x="4" y="8" width="15" height="82" rx="4" fill="url(#woodGrad)"/>
            <line x1="8" y1="14" x2="8" y2="86" stroke="#5c3a1a" stroke-width="1" opacity="0.5"/>
            <line x1="14" y1="14" x2="14" y2="86" stroke="#5c3a1a" stroke-width="1" opacity="0.4"/>
            <circle id="bedKnob1" cx="11.5" cy="12" r="4" fill="#6b4420"/>
            <circle cx="10" cy="10.5" r="1.3" fill="#c79a63" opacity="0.8"/>
            <circle id="bedKnob2" cx="11.5" cy="22" r="3" fill="#6b4420"/>
            <rect x="101" y="26" width="15" height="64" rx="4" fill="url(#woodGrad)"/>
            <line x1="105" y1="30" x2="105" y2="86" stroke="#5c3a1a" stroke-width="1" opacity="0.4"/>
            <circle id="bedKnob3" cx="108.5" cy="30" r="3.5" fill="#6b4420"/>
            <circle cx="107.2" cy="28.7" r="1.1" fill="#c79a63" opacity="0.8"/>
          </g>

          <!-- Tier 2: arched headboard/footboard -->
          <g class="tierIs2">
            <path d="M4 90V20a9 9 0 0 1 18 0v70z" fill="url(#woodGrad)"/>
            <line x1="9" y1="24" x2="9" y2="86" stroke="#5c3a1a" stroke-width="1" opacity="0.4"/>
            <line x1="16" y1="24" x2="16" y2="86" stroke="#5c3a1a" stroke-width="1" opacity="0.3"/>
            <circle cx="13" cy="15" r="1.6" fill="#c79a63" opacity="0.7"/>
            <path d="M98 90V48a9 9 0 0 1 18 0v42z" fill="url(#woodGrad)"/>
            <line x1="103" y1="52" x2="103" y2="86" stroke="#5c3a1a" stroke-width="1" opacity="0.3"/>
            <circle cx="107" cy="43" r="1.3" fill="#c79a63" opacity="0.7"/>
          </g>

          <!-- Tier 3: low modern platform bed, open foot -->
          <g class="tierIs3">
            <rect x="15" y="8" width="90" height="26" rx="10" fill="url(#blanketGrad)" opacity="0.85"/>
            <rect x="15" y="71" width="8" height="16" rx="2" fill="url(#woodGrad)"/>
            <rect x="97" y="71" width="8" height="16" rx="2" fill="url(#woodGrad)"/>
          </g>

          <!-- Tier 4: floating luxury bed, tufted headboard, recessed legs -->
          <g class="tierIs4">
            <rect x="15" y="2" width="90" height="34" rx="12" fill="url(#blanketGrad)"/>
            <circle cx="30" cy="9" r="1.5" fill="#fff8dc" opacity="0.85"/>
            <circle cx="50" cy="9" r="1.5" fill="#fff8dc" opacity="0.85"/>
            <circle cx="70" cy="9" r="1.5" fill="#fff8dc" opacity="0.85"/>
            <circle cx="90" cy="9" r="1.5" fill="#fff8dc" opacity="0.85"/>
            <circle cx="40" cy="19" r="1.5" fill="#fff8dc" opacity="0.85"/>
            <circle cx="60" cy="19" r="1.5" fill="#fff8dc" opacity="0.85"/>
            <circle cx="80" cy="19" r="1.5" fill="#fff8dc" opacity="0.85"/>
            <rect x="22" y="78" width="5" height="10" rx="2" fill="url(#woodGrad)"/>
            <rect x="93" y="78" width="5" height="10" rx="2" fill="url(#woodGrad)"/>
          </g>

          <rect x="6" y="62" width="108" height="9" rx="2" fill="url(#woodGrad)"/>
          <g class="tierMin4 bed-led">
            <rect x="10" y="72.5" width="100" height="2.2" rx="1.1" fill="#4fd8ff" opacity="0.9"/>
          </g>
          <rect x="19" y="34" width="86" height="32" rx="6" fill="url(#blanketGrad)"/>
          <path d="M30 36c4 6 4 20 0 28" stroke="#2f74ad" stroke-width="1.4" fill="none" opacity="0.45"/>
          <path d="M55 34c4 8 4 22 0 32" stroke="#2f74ad" stroke-width="1.4" fill="none" opacity="0.45"/>
          <path d="M80 36c4 6 4 20 0 28" stroke="#2f74ad" stroke-width="1.4" fill="none" opacity="0.45"/>
          <g class="tierMin4 bed-throw">
            <rect x="74" y="39" width="28" height="11" rx="3" fill="#fdf6e3" opacity="0.95"/>
            <line x1="77" y1="44.5" x2="99" y2="44.5" stroke="#e0d4a8" stroke-width="1" opacity="0.7"/>
          </g>
          <rect id="bedTrim" x="19" y="58" width="86" height="8" rx="3" fill="#f5c518"/>
          <rect x="19" y="58" width="86" height="3" fill="#fff" opacity="0.35"/>
          <g class="tierMin3">
            <rect x="42" y="27" width="26" height="15" rx="6" fill="url(#pillowGrad)" stroke="#cfd2d6" stroke-width="1"/>
          </g>
          <rect x="17" y="24" width="30" height="18" rx="6" fill="url(#pillowGrad)" stroke="#cfd2d6" stroke-width="1"/>
          <path d="M20 30c4-2 8-2 12 0" stroke="#c9ccd0" stroke-width="1" fill="none" opacity="0.7"/>
        </svg>
      </div>
    </div>

    <div class="furniture fridge" id="fridgeBtn">
      <button class="upgrade-badge" id="fridgeUpgradeBtn">
        <span class="cost" id="fridgeCost">$500</span>
      </button>
      <svg viewBox="0 0 90 132" width="112" height="192" preserveAspectRatio="none">
        <defs>
          <linearGradient id="fridgeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop id="fridgeStop1" offset="0%" stop-color="#a9ece6"/>
            <stop id="fridgeStop2" offset="55%" stop-color="#7fd9d4"/>
            <stop id="fridgeStop3" offset="100%" stop-color="#5cb8b2"/>
          </linearGradient>
          <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="18%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <ellipse cx="45" cy="129" rx="34" ry="4.5" fill="#000" opacity="0.18"/>
        <rect x="14" y="122" width="6" height="7" rx="1.5" fill="#3a5a58"/>
        <rect x="70" y="122" width="6" height="7" rx="1.5" fill="#3a5a58"/>
        <rect id="fridgeBodyStroke" x="4" y="4" width="82" height="124" rx="10" fill="url(#fridgeGrad)" stroke="#4fb3ab" stroke-width="3"/>
        <rect x="4" y="4" width="82" height="124" rx="10" fill="url(#doorGrad)"/>
        <line id="fridgeDivider" x1="4" y1="44" x2="86" y2="44" stroke="#4fb3ab" stroke-width="3"/>
        <rect x="9" y="9" width="8" height="28" rx="4" fill="#ffffff" opacity="0.25"/>
        <g class="tierMax3 fridge-handles">
          <rect id="fridgeHandle1" x="70" y="10" width="8" height="20" rx="4" fill="#2f7570"/>
          <rect x="71" y="11.5" width="2.5" height="17" rx="1.2" fill="#ffffff" opacity="0.35"/>
          <rect id="fridgeHandle2" x="70" y="52" width="8" height="46" rx="4" fill="#2f7570"/>
          <rect x="71" y="53.5" width="2.5" height="43" rx="1.2" fill="#ffffff" opacity="0.35"/>
        </g>
        <g class="tierMin4 fridge-slim-handles">
          <rect x="73.5" y="10" width="2.5" height="20" rx="1.2" fill="#eef2f2" opacity="0.9"/>
          <rect x="73.5" y="52" width="2.5" height="46" rx="1.2" fill="#eef2f2" opacity="0.9"/>
        </g>
        <g class="tierMax2 fridge-notes">
          <g transform="translate(28,60) rotate(-6)">
            <rect width="20" height="16" fill="#f7d34a" stroke="#d8ad1e" stroke-width="1"/>
            <line x1="3" y1="4" x2="16" y2="4" stroke="#d8ad1e" stroke-width="1" opacity="0.6"/>
            <line x1="3" y1="8" x2="13" y2="8" stroke="#d8ad1e" stroke-width="1" opacity="0.6"/>
          </g>
          <g transform="translate(40,78) rotate(4)">
            <rect width="18" height="15" fill="#f7d34a" stroke="#d8ad1e" stroke-width="1"/>
            <line x1="3" y1="4" x2="14" y2="4" stroke="#d8ad1e" stroke-width="1" opacity="0.6"/>
          </g>
        </g>
        <g class="tierMin3 fridge-screen">
          <rect x="14" y="12" width="44" height="20" rx="4" fill="#0d1b1a"/>
          <rect x="19" y="24" width="26" height="3" rx="1.5" fill="#7fe8c9" opacity="0.85"/>
          <circle cx="52" cy="17" r="2" fill="#7fe8c9" opacity="0.7"/>
          <g class="tierMin4">
            <rect x="19" y="17" width="18" height="3" rx="1.5" fill="#ffe066" opacity="0.85"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="banner">DOKUN VE KAZAN!</div>
  </div>

  <div class="navbar">
    <button class="nav-btn active" data-nav="home">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z" fill="currentColor"/></svg>
    </button>
    <button class="nav-btn" data-nav="school">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3 2 8l10 5 10-5-10-5z" fill="currentColor"/><path d="M6 10.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="21" y1="9" x2="21" y2="16" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button class="nav-btn" data-nav="job">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="3" y1="12.5" x2="21" y2="12.5" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="nav-btn" data-nav="bank">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 10 12 4l9 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="4" y="10" width="2.4" height="9" fill="currentColor"/><rect x="10.8" y="10" width="2.4" height="9" fill="currentColor"/><rect x="17.6" y="10" width="2.4" height="9" fill="currentColor"/><rect x="3" y="19" width="18" height="2" fill="currentColor"/></svg>
    </button>
    <button class="nav-btn" data-nav="shop">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h2l1.6 10.2A2 2 0 0 0 9.6 17h8.2a2 2 0 0 0 2-1.6L21 8H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20.5" r="1.4" fill="currentColor"/><circle cx="18" cy="20.5" r="1.4" fill="currentColor"/></svg>
    </button>
    <button class="nav-btn" data-nav="world">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4z" fill="currentColor"/>
        <path d="M7 5H4a3 3 0 0 0 3 4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M17 5h3a3 3 0 0 1-3 4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <rect x="10.5" y="12" width="3" height="4" fill="currentColor"/>
        <rect x="8" y="18" width="8" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="game.js"></script>
</body>
</html>
