<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap Life - Tıkla ve Kazan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <div class="topbar">
    <div class="profile">
      <div class="avatar">🧑‍🍳</div>
      <div class="level-badge" id="levelBadge">1</div>
    </div>
    <div class="money-pill">
      <span class="coin">💰</span>
      <span id="moneyText">$0</span>
    </div>
    <div class="day-pill">
      <span id="dayText">Gün 1</span>
    </div>
    <button class="mute-btn" id="muteBtn" aria-label="Ses">🔊</button>
  </div>

  <div class="statsbar">
    <div class="stat">
      <span class="stat-icon">❤️</span>
      <div class="bar"><div class="bar-fill health" id="healthFill"></div></div>
    </div>
    <div class="stat">
      <span class="stat-icon">⚡</span>
      <div class="bar"><div class="bar-fill energy" id="energyFill"></div></div>
    </div>
    <div class="stat">
      <span class="stat-icon">🍴</span>
      <div class="bar"><div class="bar-fill hunger" id="hungerFill"></div></div>
    </div>
  </div>

  <div class="topstrip"></div>

  <div class="scene" id="scene">

    <div class="side-icons">
    <button class="quest-icon side-icon" id="questBtn" aria-label="Görevler">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <rect x="5" y="3" width="14" height="18" rx="2" fill="#fff" stroke="#7a5228" stroke-width="1.2"/>
        <rect x="9" y="1.5" width="6" height="3" rx="1.2" fill="#7a5228"/>
        <path d="M7.5 8.5 8.7 9.7 10.5 7.4" stroke="#3fb950" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12" y1="8.5" x2="16.5" y2="8.5" stroke="#c7c7c7" stroke-width="1.2"/>
        <path d="M7.5 13 8.7 14.2 10.5 11.9" stroke="#3fb950" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12" y1="13" x2="16.5" y2="13" stroke="#c7c7c7" stroke-width="1.2"/>
        <path d="M7 17 9 19 M9 17 7 19" stroke="#ef4444" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="12" y1="17.5" x2="16.5" y2="17.5" stroke="#c7c7c7" stroke-width="1.2"/>
      </svg>
    </button>
    <button class="side-icon emoji" id="lotteryBtn" aria-label="Kazı Kazan">🎟️</button>
    <button class="side-icon emoji" id="recordsBtn" aria-label="Rekorlar">📊</button>
    <button class="side-icon emoji" id="eventBtn" aria-label="Etkinlikler">🎉</button>
    </div>

    <div class="tap-wrap">
      <div class="tap-stack" id="floaters"></div>
      <button class="tap-btn" id="tapBtn">
        <span id="tapLabel">TAP</span>
      </button>
    </div>

    <!-- The room itself is rendered in 3D; see world.js -->
    <canvas class="world-canvas" id="worldCanvas"></canvas>

    <!-- Upgrade badges float above the 3D objects they belong to. Their screen
         positions are projected from the world every frame. -->
    <div class="badge-layer" id="badgeLayer">
      <button class="upgrade-badge world-badge" id="bedUpgradeBtn" data-badge="bed"><span class="cost" id="bedCost">$500</span></button>
      <button class="upgrade-badge world-badge" id="fridgeUpgradeBtn" data-badge="fridge"><span class="cost" id="fridgeCost">$500</span></button>
      <button class="upgrade-badge world-badge" id="plantUpgradeBtn" data-badge="plant"><span class="cost" id="plantCost">$250</span></button>
      <button class="upgrade-badge world-badge" id="rugUpgradeBtn" data-badge="rug"><span class="cost" id="rugCost">$2,000</span></button>
      <button class="upgrade-badge world-badge" id="lampUpgradeBtn" data-badge="lamp"><span class="cost" id="lampCost">$3,500</span></button>
      <button class="upgrade-badge world-badge" id="pictureUpgradeBtn" data-badge="picture"><span class="cost" id="pictureCost">$5,000</span></button>
      <button class="upgrade-badge world-badge" id="shelfUpgradeBtn" data-badge="shelf"><span class="cost" id="shelfCost">$8,000</span></button>
      <button class="upgrade-badge world-badge" id="tvUpgradeBtn" data-badge="tv"><span class="cost" id="tvCost">$12,000</span></button>
      <button class="upgrade-badge world-badge" id="petUpgradeBtn" data-badge="pet"><span class="cost" id="petCost">$6,000</span></button>
      <div class="pet-meter world-badge" id="petMeter" data-badge="petMeter">
        <div class="pet-meter-fill" id="petMeterFill"></div>
      </div>
    </div>


    <div class="hud-chips">
      <div class="hud-chip event-chip" id="eventChip"></div>
      <div class="hud-chip work-chip" id="workChip"></div>
      <div class="hud-chip combo-chip" id="comboChip"></div>
    </div>

    <div class="banner" id="banner">
      <span class="banner-tut">DOKUN VE KAZAN!</span>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div><span class="xp-text" id="xpText"></span></div>
    </div>
  </div>

  <div class="navbar">
    <button class="nav-btn active" data-nav="home">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z" fill="currentColor"/></svg>
    </button>
    <button class="nav-btn" data-nav="school">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3 2 8l10 5 10-5-10-5z" fill="currentColor"/><path d="M6 10.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="21" y1="9" x2="21" y2="16" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button class="nav-btn" data-nav="job">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="3" y1="12.5" x2="21" y2="12.5" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="nav-btn" data-nav="bank">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 10 12 4l9 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="4" y="10" width="2.4" height="9" fill="currentColor"/><rect x="10.8" y="10" width="2.4" height="9" fill="currentColor"/><rect x="17.6" y="10" width="2.4" height="9" fill="currentColor"/><rect x="3" y="19" width="18" height="2" fill="currentColor"/></svg>
    </button>
    <button class="nav-btn" data-nav="shop">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h2l1.6 10.2A2 2 0 0 0 9.6 17h8.2a2 2 0 0 0 2-1.6L21 8H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20.5" r="1.4" fill="currentColor"/><circle cx="18" cy="20.5" r="1.4" fill="currentColor"/></svg>
    </button>
    <button class="nav-btn" data-nav="world">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4z" fill="currentColor"/>
        <path d="M7 5H4a3 3 0 0 0 3 4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M17 5h3a3 3 0 0 1-3 4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <rect x="10.5" y="12" width="3" height="4" fill="currentColor"/>
        <rect x="8" y="18" width="8" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="sheet" id="buySheet">
    <div class="sheet-panel">
      <div class="buy-head">
        <div class="buy-title" id="buyTitle">Yükselt</div>
        <button class="shop-close" id="buyClose" aria-label="Kapat">✕</button>
      </div>
      <div class="buy-compare">
        <div class="buy-col">
          <div class="buy-label">Şu an</div>
          <div class="preview" id="buyPrevNow"></div>
          <div class="buy-cap" id="buyCapNow"></div>
        </div>
        <div class="buy-arrow">➜</div>
        <div class="buy-col next">
          <div class="buy-label">Yeni model</div>
          <div class="preview" id="buyPrevNext"></div>
          <div class="buy-cap" id="buyCapNext"></div>
        </div>
      </div>
      <div class="buy-stats" id="buyStats"></div>
      <button class="buy-btn" id="buyConfirm">Satın Al</button>
    </div>
  </div>
  <div class="fx-layer" id="fxLayer"></div>
  <div class="reward-card" id="rewardCard">
    <div class="reward-icon" id="rewardIcon"></div>
    <div class="reward-title" id="rewardTitle"></div>
    <div class="reward-sub" id="rewardSub"></div>
  </div>

  <div class="shop" id="panel">
    <div class="shop-panel">
      <div class="shop-head">
        <div>
          <div class="shop-title" id="panelTitle"></div>
          <div class="shop-sub" id="panelSub"></div>
        </div>
        <button class="shop-close" id="panelClose" aria-label="Kapat">✕</button>
      </div>
      <div class="shop-list" id="panelBody"></div>
    </div>
  </div>

  <div class="shop" id="shop">
    <div class="shop-panel">
      <div class="shop-head">
        <div>
          <div class="shop-title">🛒 Market</div>
          <div class="shop-sub" id="shopSub">Ev çarpanı ×1.00</div>
        </div>
        <button class="shop-close" id="shopClose" aria-label="Kapat">✕</button>
      </div>
      <div class="shop-list" id="shopList"></div>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script src="world.js"></script>
<script src="game.js"></script>
</body>
</html>
