<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap Life - Tıkla ve Kazan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <div class="topbar">
    <div class="profile">
      <div class="avatar">🧑‍🍳</div>
      <div class="level-badge" id="levelBadge">1</div>
    </div>
    <div class="money-pill">
      <span class="coin">💰</span>
      <span id="moneyText">$0</span>
    </div>
    <div class="day-pill">
      <span id="dayText">Gün 1</span>
    </div>
  </div>

  <div class="statsbar">
    <div class="stat">
      <span class="stat-icon">❤️</span>
      <div class="bar"><div class="bar-fill health" id="healthFill"></div></div>
    </div>
    <div class="stat">
      <span class="stat-icon">⚡</span>
      <div class="bar"><div class="bar-fill energy" id="energyFill"></div></div>
    </div>
    <div class="stat">
      <span class="stat-icon">🍴</span>
      <div class="bar"><div class="bar-fill hunger" id="hungerFill"></div></div>
    </div>
  </div>

  <div class="topstrip"></div>

  <div class="scene" id="scene">

    <button class="quest-icon" id="questBtn" aria-label="Görevler">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <rect x="5" y="3" width="14" height="18" rx="2" fill="#fff" stroke="#7a5228" stroke-width="1.2"/>
        <rect x="9" y="1.5" width="6" height="3" rx="1.2" fill="#7a5228"/>
        <path d="M7.5 8.5 8.7 9.7 10.5 7.4" stroke="#3fb950" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12" y1="8.5" x2="16.5" y2="8.5" stroke="#c7c7c7" stroke-width="1.2"/>
        <path d="M7.5 13 8.7 14.2 10.5 11.9" stroke="#3fb950" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12" y1="13" x2="16.5" y2="13" stroke="#c7c7c7" stroke-width="1.2"/>
        <path d="M7 17 9 19 M9 17 7 19" stroke="#ef4444" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="12" y1="17.5" x2="16.5" y2="17.5" stroke="#c7c7c7" stroke-width="1.2"/>
      </svg>
    </button>

    <div class="tap-wrap">
      <div class="tap-stack" id="floaters"></div>
      <button class="tap-btn" id="tapBtn">
        <span id="tapLabel">TAP</span>
      </button>
    </div>

    <div class="furniture plant" id="plantBtn">
      <button class="upgrade-badge" id="plantUpgradeBtn">
        <span class="cost" id="plantCost">$250</span>
      </button>
      <svg viewBox="0 0 40 46" width="60" height="69">
        <defs>
          <linearGradient id="leafShade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#000" stop-opacity="0"/>
            <stop offset="56%" stop-color="#000" stop-opacity="0"/>
            <stop offset="56%" stop-color="#000" stop-opacity="0.24"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.24"/>
          </linearGradient>
          <linearGradient id="potShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.34"/>
            <stop offset="30%" stop-color="#fff" stop-opacity="0.34"/>
            <stop offset="30%" stop-color="#fff" stop-opacity="0"/>
            <stop offset="70%" stop-color="#000" stop-opacity="0"/>
            <stop offset="70%" stop-color="#000" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
          </linearGradient>
        </defs>

        <ellipse cx="20" cy="44.6" rx="14" ry="1.6" fill="#3a2a22" opacity="0.22"/>
        <ellipse cx="20" cy="27.5" rx="11.5" ry="2.8" fill="#4a3320"/>

        <g class="leaves">
        <!-- Chunky leaves -->
        <path id="plantLeaf1" d="M20 28c-4-9-11-6-13-15 8-1 13 6 13 15z" fill="#3fae52"/>
        <path d="M20 28c-4-9-11-6-13-15 8-1 13 6 13 15z" fill="url(#leafShade)"/>
        <path d="M20 28c-4-9-11-6-13-15 8-1 13 6 13 15z" fill="none" stroke="#1f5a2a" stroke-width="1.1" stroke-linejoin="round"/>
        <path id="plantLeaf2" d="M20 28c1-12 11-10 13-20-9 1-14 9-13 20z" fill="#57cc6a"/>
        <path d="M20 28c1-12 11-10 13-20-9 1-14 9-13 20z" fill="url(#leafShade)"/>
        <path d="M20 28c1-12 11-10 13-20-9 1-14 9-13 20z" fill="none" stroke="#1f5a2a" stroke-width="1.1" stroke-linejoin="round"/>
        <path id="plantLeaf3" d="M20 28c-2-7-8-4-9-12 7 0 9 5 9 12z" fill="#7fe08c"/>
        <path d="M20 28c-2-7-8-4-9-12 7 0 9 5 9 12z" fill="url(#leafShade)"/>
        <path d="M20 28c-2-7-8-4-9-12 7 0 9 5 9 12z" fill="none" stroke="#1f5a2a" stroke-width="1" stroke-linejoin="round"/>
        <path d="M9.5 15c2 1 4 3 5.5 6" stroke="#fff" stroke-opacity="0.45" stroke-width="0.9" fill="none" stroke-linecap="round"/>
        <path d="M31 10c-2 2-4 5-5.5 9" stroke="#fff" stroke-opacity="0.45" stroke-width="0.9" fill="none" stroke-linecap="round"/>
        <g class="tierMin3">
          <path id="plantLeaf4" d="M20 28c4-8 11-5 14-12-7-1-12 4-14 12z" fill="#7fe08c"/>
          <path d="M20 28c4-8 11-5 14-12-7-1-12 4-14 12z" fill="url(#leafShade)"/>
          <path d="M20 28c4-8 11-5 14-12-7-1-12 4-14 12z" fill="none" stroke="#1f5a2a" stroke-width="1" stroke-linejoin="round"/>
          <path id="plantLeaf5" d="M20 28c-4-6-10-3-13-9 6-2 11 2 13 9z" fill="#57cc6a"/>
          <path d="M20 28c-4-6-10-3-13-9 6-2 11 2 13 9z" fill="url(#leafShade)"/>
          <path d="M20 28c-4-6-10-3-13-9 6-2 11 2 13 9z" fill="none" stroke="#1f5a2a" stroke-width="1" stroke-linejoin="round"/>
        </g>
        <g class="tierMin4 plant-flowers">
          <circle cx="12" cy="12" r="2.6" fill="#ff9fd0" stroke="#8a3f6a" stroke-width="0.8"/>
          <circle cx="11.2" cy="11.2" r="1" fill="#fff" opacity="0.7"/>
          <circle cx="12" cy="12" r="1" fill="#ffd54f"/>
          <circle cx="26" cy="8" r="2.3" fill="#ff9fd0" stroke="#8a3f6a" stroke-width="0.8"/>
          <circle cx="25.3" cy="7.3" r="0.9" fill="#fff" opacity="0.7"/>
          <circle cx="26" cy="8" r="0.9" fill="#ffd54f"/>
        </g>

        </g>
        <!-- Chunky pot -->
        <g class="tierMax2">
          <path id="plantPotBody" d="M8 29h24l-3.5 15H11.5z" fill="#c9752a"/>
          <path d="M8 29h24l-3.5 15H11.5z" fill="url(#potShade)"/>
          <rect x="9" y="30.5" width="22" height="2" fill="#000" opacity="0.22"/>
          <path d="M8 29h24l-3.5 15H11.5z" fill="none" stroke="#3a2a22" stroke-width="1.4" stroke-linejoin="round"/>
          <rect id="plantPotRim" x="6.5" y="24" width="27" height="7" rx="3" fill="#8f4a1a"/>
          <rect x="6.5" y="24" width="27" height="7" rx="3" fill="url(#potShade)"/>
          <rect x="6.5" y="24" width="27" height="7" rx="3" fill="none" stroke="#3a2a22" stroke-width="1.4"/>
          <rect x="11" y="33" width="3" height="8" rx="1.5" fill="#fff" opacity="0.4"/>
        </g>
        <g class="tierMin3">
          <path id="plantPotBodyModern" d="M8 29h24l-2.5 14a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="#9a9aa3"/>
          <path d="M8 29h24l-2.5 14a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="url(#potShade)"/>
          <rect x="9" y="30.5" width="22" height="2" fill="#000" opacity="0.2"/>
          <path d="M8 29h24l-2.5 14a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="none" stroke="#3a2a22" stroke-width="1.4" stroke-linejoin="round"/>
          <rect id="plantPotRimModern" x="6.5" y="25" width="27" height="6" rx="3" fill="#5c5c63"/>
          <rect x="6.5" y="25" width="27" height="6" rx="3" fill="url(#potShade)"/>
          <rect x="6.5" y="25" width="27" height="6" rx="3" fill="none" stroke="#3a2a22" stroke-width="1.4"/>
          <rect x="11" y="33" width="3" height="8" rx="1.5" fill="#fff" opacity="0.4"/>
          <rect class="tierMin4" x="7.5" y="25.6" width="25" height="1.6" fill="#ffe066"/>
        </g>
      </svg>
    </div>

    <div class="furniture bed" id="bedBtn">
      <button class="upgrade-badge" id="bedUpgradeBtn">
        <span class="cost" id="bedCost">$500</span>
      </button>
      <div class="bed-wrap">
        <div class="zzz-stack" id="zzz">
          <span>z</span><span>z</span><span>Z</span>
        </div>
        <svg viewBox="0 0 120 110" width="172" height="158">
          <defs>
            <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
              <stop id="woodStop1" offset="0%" stop-color="#b97d42"/>
              <stop id="woodStop2" offset="100%" stop-color="#7a4a22"/>
            </linearGradient>
            <linearGradient id="blanketGrad" x1="0" y1="0" x2="0" y2="1">
              <stop id="blanketStop1" offset="0%" stop-color="#66c4ff"/>
              <stop id="blanketStop2" offset="100%" stop-color="#2f8fe6"/>
            </linearGradient>
            <linearGradient id="celH" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fff" stop-opacity="0.32"/>
              <stop offset="34%" stop-color="#fff" stop-opacity="0.32"/>
              <stop offset="34%" stop-color="#fff" stop-opacity="0"/>
              <stop offset="70%" stop-color="#000" stop-opacity="0"/>
              <stop offset="70%" stop-color="#000" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#000" stop-opacity="0.22"/>
            </linearGradient>
            <linearGradient id="celV" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
              <stop offset="36%" stop-color="#fff" stop-opacity="0.3"/>
              <stop offset="36%" stop-color="#fff" stop-opacity="0"/>
              <stop offset="68%" stop-color="#000" stop-opacity="0"/>
              <stop offset="68%" stop-color="#000" stop-opacity="0.2"/>
              <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
            </linearGradient>
            <clipPath id="clipBlanket"><path d="M21 46q0-8 8-8h62q8 0 8 8v13c-4 6-12 6-16 0c-4 6-12 6-16 0c-4 6-12 6-16 0c-4 6-12 6-16 0c-3 5-10 5-14 0z"/></clipPath>
          </defs>

          <ellipse cx="60" cy="106" rx="58" ry="3.8" fill="#3a2a22" opacity="0.22"/>

          <!-- Posts: identical body/proportions at every tier, so it always reads as a bed -->
          <rect x="3" y="6" width="18" height="102" rx="6" fill="url(#woodGrad)"/>
          <rect x="3" y="6" width="18" height="102" rx="6" fill="url(#celH)"/>
          <rect x="3" y="6" width="18" height="102" rx="6" fill="none" stroke="#3a2a22" stroke-width="2"/>
          <rect x="99" y="30" width="18" height="78" rx="6" fill="url(#woodGrad)"/>
          <rect x="99" y="30" width="18" height="78" rx="6" fill="url(#celH)"/>
          <rect x="99" y="30" width="18" height="78" rx="6" fill="none" stroke="#3a2a22" stroke-width="2"/>

          <!-- Tier 1: big round wooden knobs -->
          <g class="tierIs1">
            <circle id="bedKnob1" cx="12" cy="9" r="6" fill="#6f4220"/>
            <circle cx="12" cy="9" r="6" fill="url(#celH)"/>
            <circle cx="12" cy="9" r="6" fill="none" stroke="#3a2a22" stroke-width="2"/>
            <circle cx="10" cy="7" r="1.8" fill="#fff" opacity="0.7"/>
            <circle id="bedKnob2" cx="12" cy="23" r="4" fill="#6f4220"/>
            <circle cx="12" cy="23" r="4" fill="url(#celH)"/>
            <circle cx="12" cy="23" r="4" fill="none" stroke="#3a2a22" stroke-width="1.6"/>
            <circle id="bedKnob3" cx="108" cy="33" r="5" fill="#6f4220"/>
            <circle cx="108" cy="33" r="5" fill="url(#celH)"/>
            <circle cx="108" cy="33" r="5" fill="none" stroke="#3a2a22" stroke-width="2"/>
            <circle cx="106.4" cy="31.4" r="1.5" fill="#fff" opacity="0.7"/>
          </g>

          <!-- Tier 2: flared wooden cap -->
          <g class="tierIs2">
            <rect x="0" y="3" width="24" height="10" rx="5" fill="url(#woodGrad)"/>
            <rect x="0" y="3" width="24" height="10" rx="5" fill="url(#celV)"/>
            <rect x="0" y="3" width="24" height="10" rx="5" fill="none" stroke="#3a2a22" stroke-width="2"/>
            <rect x="96" y="27" width="24" height="10" rx="5" fill="url(#woodGrad)"/>
            <rect x="96" y="27" width="24" height="10" rx="5" fill="url(#celV)"/>
            <rect x="96" y="27" width="24" height="10" rx="5" fill="none" stroke="#3a2a22" stroke-width="2"/>
          </g>

          <!-- Tier 3: flat steel cap -->
          <g class="tierIs3">
            <rect x="2" y="3" width="20" height="8" rx="3" fill="#d3d8de"/>
            <rect x="2" y="3" width="20" height="8" rx="3" fill="url(#celV)"/>
            <rect x="2" y="3" width="20" height="8" rx="3" fill="none" stroke="#3a2a22" stroke-width="2"/>
            <rect x="98" y="27" width="20" height="8" rx="3" fill="#d3d8de"/>
            <rect x="98" y="27" width="20" height="8" rx="3" fill="url(#celV)"/>
            <rect x="98" y="27" width="20" height="8" rx="3" fill="none" stroke="#3a2a22" stroke-width="2"/>
          </g>

          <!-- Tier 4: gilded ornamental cap -->
          <g class="tierIs4">
            <rect x="2" y="2" width="20" height="9" rx="4" fill="#ffd54f"/>
            <rect x="2" y="2" width="20" height="9" rx="4" fill="url(#celV)"/>
            <rect x="2" y="2" width="20" height="9" rx="4" fill="none" stroke="#3a2a22" stroke-width="2"/>
            <circle cx="12" cy="6.5" r="2.2" fill="#fff8d6"/>
            <rect x="98" y="26" width="20" height="9" rx="4" fill="#ffd54f"/>
            <rect x="98" y="26" width="20" height="9" rx="4" fill="url(#celV)"/>
            <rect x="98" y="26" width="20" height="9" rx="4" fill="none" stroke="#3a2a22" stroke-width="2"/>
            <circle cx="108" cy="30.5" r="2" fill="#fff8d6"/>
          </g>

          <!-- Rail -->
          <rect x="5" y="73" width="110" height="12" rx="3" fill="url(#woodGrad)"/>
          <rect x="5" y="73" width="110" height="12" rx="3" fill="url(#celV)"/>
          <rect x="5" y="73" width="110" height="12" rx="3" fill="none" stroke="#3a2a22" stroke-width="2"/>
          <g class="tierMin4 bed-led">
            <rect x="8" y="86.5" width="104" height="5" rx="2.5" fill="#4fd8ff" opacity="0.35"/>
            <rect x="9" y="87.5" width="102" height="3" rx="1.5" fill="#8ff0ff"/>
          </g>

          <!-- Mattress -->
          <rect x="21" y="50" width="78" height="23" rx="5" fill="#fbf6ea"/>
          <rect x="21" y="61" width="78" height="6" fill="#e3d9c4"/>
          <rect id="bedTrim" x="21" y="67" width="78" height="6" rx="2" fill="#ffcf33"/>
          <rect x="21" y="67" width="78" height="6" rx="2" fill="url(#celV)"/>
          <rect x="21" y="50" width="78" height="23" rx="5" fill="none" stroke="#3a2a22" stroke-width="2"/>

          <!-- Puffy blanket with scalloped hem -->
          <path d="M21 46q0-8 8-8h62q8 0 8 8v13c-4 6-12 6-16 0c-4 6-12 6-16 0c-4 6-12 6-16 0c-4 6-12 6-16 0c-3 5-10 5-14 0z" transform="translate(0 3)" fill="#3a2a22" opacity="0.22"/>
          <path d="M21 46q0-8 8-8h62q8 0 8 8v13c-4 6-12 6-16 0c-4 6-12 6-16 0c-4 6-12 6-16 0c-4 6-12 6-16 0c-3 5-10 5-14 0z" fill="url(#blanketGrad)"/>
          <rect x="21" y="38" width="78" height="9" fill="#fff" opacity="0.28" clip-path="url(#clipBlanket)"/>
          <rect x="21" y="56" width="78" height="12" fill="#000" opacity="0.14" clip-path="url(#clipBlanket)"/>
          <g clip-path="url(#clipBlanket)">
            <path d="M44 40c3 7 3 14 0 21" stroke="#fff" stroke-width="2.2" fill="none" opacity="0.38"/>
            <path d="M72 40c3 7 3 14 0 21" stroke="#fff" stroke-width="2.2" fill="none" opacity="0.38"/>
            <path d="M48 40c3 7 3 14 0 21" stroke="#000" stroke-width="1.6" fill="none" opacity="0.14"/>
            <path d="M76 40c3 7 3 14 0 21" stroke="#000" stroke-width="1.6" fill="none" opacity="0.14"/>
          </g>
          <path d="M21 46q0-8 8-8h62q8 0 8 8v13c-4 6-12 6-16 0c-4 6-12 6-16 0c-4 6-12 6-16 0c-4 6-12 6-16 0c-3 5-10 5-14 0z" fill="none" stroke="#3a2a22" stroke-width="2" stroke-linejoin="round"/>

          <g class="tierMin4 bed-throw" transform="rotate(-3 87 50)">
            <rect x="73" y="46" width="30" height="12" rx="4" fill="#3a2a22" opacity="0.22"/>
            <rect x="72" y="44" width="30" height="12" rx="4" fill="#fff1d6"/>
            <rect x="72" y="44" width="30" height="12" rx="4" fill="url(#celV)"/>
            <rect x="72" y="44" width="30" height="12" rx="4" fill="none" stroke="#3a2a22" stroke-width="1.8"/>
            <line x1="76" y1="50" x2="98" y2="50" stroke="#d9c39a" stroke-width="1.4"/>
          </g>

          <!-- Puffy pillows -->
          <ellipse cx="34" cy="49" rx="18" ry="3" fill="#3a2a22" opacity="0.2"/>
          <g class="tierMin3">
            <rect x="44" y="31" width="28" height="17" rx="8.5" fill="#ffffff"/>
            <rect x="44" y="31" width="28" height="17" rx="8.5" fill="url(#celV)" opacity="0.55"/>
            <rect x="44" y="31" width="28" height="17" rx="8.5" fill="none" stroke="#3a2a22" stroke-width="1.8"/>
          </g>
          <rect x="15" y="28" width="34" height="20" rx="10" fill="#ffffff"/>
          <rect x="15" y="28" width="34" height="20" rx="10" fill="url(#celV)" opacity="0.55"/>
          <rect x="15" y="28" width="34" height="20" rx="10" fill="none" stroke="#3a2a22" stroke-width="2"/>
          <path d="M22 35c4-2.5 9-2.5 13 0" stroke="#aeb7c4" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="furniture fridge" id="fridgeBtn">
      <button class="upgrade-badge" id="fridgeUpgradeBtn">
        <span class="cost" id="fridgeCost">$500</span>
      </button>
      <svg viewBox="0 0 90 154" width="112" height="192">
        <defs>
          <linearGradient id="fridgeGrad" x1="0" y1="0" x2="1" y2="0.25">
            <stop id="fridgeStop1" offset="0%" stop-color="#b6f3ec"/>
            <stop id="fridgeStop2" offset="55%" stop-color="#7fe0d8"/>
            <stop id="fridgeStop3" offset="100%" stop-color="#4fc4ba"/>
          </linearGradient>
          <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
            <stop offset="10%" stop-color="#ffffff" stop-opacity="0.3"/>
            <stop offset="10%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="celHf" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
            <stop offset="34%" stop-color="#fff" stop-opacity="0.5"/>
            <stop offset="34%" stop-color="#fff" stop-opacity="0"/>
            <stop offset="66%" stop-color="#000" stop-opacity="0"/>
            <stop offset="66%" stop-color="#000" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
          </linearGradient>
          <clipPath id="clipFridge"><rect x="4" y="4" width="78" height="142" rx="13"/></clipPath>
        </defs>

        <ellipse cx="45" cy="151" rx="40" ry="3.6" fill="#3a2a22" opacity="0.22"/>

        <!-- Side face for depth -->
        <path d="M82 14l5 4v118l-5 4z" fill="url(#fridgeGrad)"/>
        <path d="M82 14l5 4v118l-5 4z" fill="#000" opacity="0.32"/>
        <path d="M82 14l5 4v118l-5 4z" fill="none" stroke="#2b2b33" stroke-width="1.6" stroke-linejoin="round"/>

        <!-- Feet -->
        <rect x="11" y="144" width="9" height="8" rx="3" fill="#2b2b33"/>
        <rect x="66" y="144" width="9" height="8" rx="3" fill="#2b2b33"/>

        <!-- Body -->
        <rect id="fridgeBodyStroke" x="4" y="4" width="78" height="142" rx="13" fill="url(#fridgeGrad)" stroke="#2c6f6a" stroke-width="2.6"/>
        <rect x="4" y="4" width="78" height="142" rx="13" fill="url(#doorGrad)"/>
        <rect x="66" y="4" width="16" height="142" fill="#000" opacity="0.1" clip-path="url(#clipFridge)"/>

        <!-- Big glossy cel highlights -->
        <rect x="10" y="10" width="12" height="30" rx="6" fill="#fff" opacity="0.45"/>
        <circle cx="16" cy="45" r="2.4" fill="#fff" opacity="0.45"/>
        <rect x="10" y="62" width="12" height="60" rx="6" fill="#fff" opacity="0.38"/>
