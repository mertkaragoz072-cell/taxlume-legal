# CLASHBORN — iOS (TestFlight) derlemesi. Proje klasörü: CLASHBORN/
# Kurulum: CLASHBORN/docs/CODEMAGIC.md. İmzalama düzeni Golden Town iş akışından (branch town-economy) alındı.
workflows:
  clashborn-ios:
    name: CLASHBORN — iOS (IPA for TestFlight)
    instance_type: mac_mini_m1   # M2 kuyrukta takıldığı için deneme; M2: mac_mini_m2
    max_build_duration: 60
    working_directory: CLASHBORN

    integrations:
      app_store_connect: taxlume-admin   # hesap genelinde API anahtarı (Developer Portal > Manage keys)

    environment:
      groups:
        - ios_signing   # CERTIFICATE_PRIVATE_KEY (Golden Town ile aynı grup)
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.nexora.game
        APP_STORE_APPLE_ID: "6821135973"   # Clashborn Legends

    scripts:
      - name: Bağımlılıklar ve web paketi
        script: |
          npm install --no-audit --no-fund
          npm run build:www

      - name: iOS projesi (Capacitor)
        script: |
          npx cap add ios
          npx cap sync ios
          PLIST=ios/App/App/Info.plist
          # yatay oyun
          for K in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :$K" $PLIST || true
            /usr/libexec/PlistBuddy -c "Add :$K array" $PLIST
            /usr/libexec/PlistBuddy -c "Add :$K:0 string UIInterfaceOrientationLandscapeLeft" $PLIST
            /usr/libexec/PlistBuddy -c "Add :$K:1 string UIInterfaceOrientationLandscapeRight" $PLIST
          done
          # şifreleme beyanı (TestFlight "Missing Compliance" sormasın)
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
          # uygulama ikonu (1024, alfasız)
          cp assets/app_icon/app_icon_1024_opaque.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Derleme numarası
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 || true)
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          BUILD=$((LAST + 1))
          echo "Derleme numarası: $BUILD"
          (cd ios/App && agvtool new-version -all "$BUILD")

      # Dağıtım sertifikasını ve App Store profilini yoksa oluşturur (--create).
      # Golden Town iş akışında çalışan düzenin aynısı; ios_signing: bloğu bu yüzden yok.
      - name: Kod imzalama
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
          if ! grep -q "$BUNDLE_ID" "$HOME/export_options.plist" 2>/dev/null; then
            echo "No provisioning profile for $BUNDLE_ID reached the export options." >&2
            exit 1
          fi
          echo "signing ready for $BUNDLE_ID"

      - name: Arşivle ve IPA oluştur
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - $CM_BUILD_DIR/CLASHBORN/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Yalnızca yükle: build işlendikten sonra iç testçiler TestFlight'tan kurar.
        submit_to_testflight: false
        submit_to_app_store: false
